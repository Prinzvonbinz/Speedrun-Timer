<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Speedrun Timer</title>

<style>
:root{
    --bg:#090b10;
    --panel:#121620;
    --panel2:#191e29;
    --border:#293140;
    --text:#f5f7fb;
    --muted:#8b94a5;
    --accent:#7857ff;
    --accent2:#967cff;
    --green:#35d27f;
    --red:#ff5570;
    --yellow:#ffd166;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
}

.header{
    height:62px;
    background:#0c0f15;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:var(--accent2);
}

.header-buttons{
    display:flex;
    gap:7px;
}

.icon-button{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel);
    color:var(--text);
    font-size:19px;
}

.main{
    max-width:1100px;
    margin:auto;
    padding:20px 14px 60px;
}

.title{
    font-size:28px;
    font-weight:900;
    margin-bottom:6px;
}

.subtitle{
    color:var(--muted);
    margin-bottom:20px;
}

.button{
    min-height:42px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
    font-weight:700;
}

.button:active{
    transform:scale(.97);
}

.button.primary{
    background:var(--accent);
    border-color:var(--accent);
}

.button.green{
    background:var(--green);
    border-color:var(--green);
    color:#06140c;
}

.button.red{
    background:var(--red);
    border-color:var(--red);
    color:#25070e;
}

.button.yellow{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#201800;
}

.button.small{
    min-height:36px;
    padding:0 10px;
    font-size:13px;
}

.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:12px;
    margin-top:15px;
}

.project{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:16px;
}

.project-name{
    font-size:20px;
    font-weight:900;
    margin-bottom:7px;
}

.project-info{
    color:var(--muted);
    font-size:13px;
    margin-bottom:15px;
}

.project-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.empty{
    padding:35px 15px;
    border:1px dashed var(--border);
    border-radius:15px;
    text-align:center;
    color:var(--muted);
}

.empty-title{
    color:var(--text);
    font-size:18px;
    font-weight:800;
    margin-bottom:6px;
}

.timer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
}

.timer-name{
    font-size:25px;
    font-weight:900;
}

.timer-header-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.timer-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:28px 10px 23px;
    text-align:center;
}

.timer{
    font-family:"Courier New",monospace;
    font-size:clamp(45px,12vw,88px);
    font-weight:700;
    line-height:1;
}

.timer-status{
    color:var(--muted);
    font-size:13px;
    margin-top:10px;
}

.compare{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:10px;
}

.compare-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
}

.compare-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.compare-value{
    font-family:"Courier New",monospace;
    font-weight:700;
    font-size:17px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.good{
    color:var(--green);
}

.bad{
    color:var(--red);
}

.neutral{
    color:var(--muted);
}

.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:10px 0;
}

.control{
    min-height:54px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    color:var(--text);
    font-weight:900;
}

.control.start{
    background:var(--green);
    color:#06140c;
    border-color:var(--green);
}

.control.split{
    background:var(--accent);
    border-color:var(--accent);
}

.control.stop{
    background:var(--red);
    color:#25070e;
    border-color:var(--red);
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
    margin-top:12px;
}

.panel-header{
    min-height:53px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 12px;
    border-bottom:1px solid var(--border);
}

.panel-title{
    font-weight:900;
}

.segment-row{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) 105px 105px 90px;
    align-items:center;
    gap:7px;
    min-height:51px;
    padding:7px 11px;
    border-bottom:1px solid #202631;
}

.segment-row:last-child{
    border-bottom:0;
}

.segment-row.current{
    background:#181e2a;
}

.segment-number{
    color:var(--muted);
    text-align:center;
    font-size:12px;
}

.segment-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.segment-time,
.segment-best,
.segment-diff{
    text-align:right;
    font-family:"Courier New",monospace;
    font-size:13px;
}

.segment-best{
    color:var(--muted);
}

.history-row{
    display:grid;
    grid-template-columns:55px 1fr 110px 80px;
    align-items:center;
    gap:8px;
    padding:12px;
    border-bottom:1px solid #202631;
}

.history-row:last-child{
    border-bottom:0;
}

.history-number{
    color:var(--muted);
    font-size:12px;
}

.history-date{
    color:var(--muted);
    font-size:12px;
}

.history-time{
    font-family:"Courier New",monospace;
    font-weight:700;
}

.pb{
    color:var(--yellow);
}

.modal-background{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    z-index:200;
}

.modal{
    width:min(600px,100%);
    max-height:92vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:0 20px 80px rgba(0,0,0,.55);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:19px;
    font-weight:900;
}

.modal-body{
    padding:15px;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:7px;
    padding:13px 15px;
    border-top:1px solid var(--border);
}

.form-label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:7px;
}

.form-input{
    width:100%;
    height:45px;
    padding:0 11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0c1016;
    color:var(--text);
    outline:none;
}

.form-input:focus{
    border-color:var(--accent);
}

.segment-editor{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.editor-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr) 38px 38px 38px;
    gap:6px;
    align-items:center;
}

.editor-number{
    color:var(--muted);
    text-align:center;
    font-size:12px;
}

.editor-input{
    width:100%;
    height:41px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0c1016;
    color:var(--text);
    outline:none;
}

.editor-input:focus{
    border-color:var(--accent);
}

.editor-button{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
}

.editor-delete{
    color:var(--red);
}

.add-segment{
    margin-top:12px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.stat{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
}

.stat-value{
    font-size:20px;
    font-weight:900;
    margin-top:4px;
}

@media(max-width:700px){

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .compare{
        grid-template-columns:1fr 1fr;
    }

    .compare-box:last-child{
        grid-column:1 / -1;
    }

    .segment-row{
        grid-template-columns:30px minmax(0,1fr) 90px;
    }

    .segment-best,
    .segment-diff{
        display:none;
    }

    .history-row{
        grid-template-columns:40px 1fr 90px;
    }

    .history-date{
        display:none;
    }
}

@media(max-width:420px){

    .editor-row{
        grid-template-columns:28px minmax(0,1fr) 34px 34px 34px;
    }

    .editor-button{
        width:34px;
        height:34px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        SPEED<span>RUN</span>
    </div>

    <div class="header-buttons">

        <button
            type="button"
            class="icon-button"
            id="homeButton"
        >⌂</button>

        <button
            type="button"
            class="icon-button"
            id="settingsButton"
        >⚙</button>

    </div>

</header>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   SPEICHER
========================================================= */

const STORAGE_KEY = "speedrun_timer_final_v1";

let data = {
    projects: [],
    settings: {
        confirmReset: true,
        confirmDelete: true
    }
};

let activeProjectId = null;

let timer = {
    running: false,
    finished: false,
    currentSegment: 0,
    segmentTimes: [],
    segmentStartedAt: 0,
    runStartedAt: null
};


/* =========================================================
   BASIS
========================================================= */

function id(){
    return Date.now().toString(36) +
        Math.random().toString(36).slice(2,8);
}

function load(){
    try{
        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){
            const parsed = JSON.parse(saved);

            if(parsed && typeof parsed === "object"){
                data = parsed;
            }
        }
    }catch(error){
        console.error(error);
    }

    normalize();
}

function save(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function normalize(){

    if(!Array.isArray(data.projects)){
        data.projects = [];
    }

    if(!data.settings){
        data.settings = {
            confirmReset:true,
            confirmDelete:true
        };
    }

    data.projects.forEach(project => {

        if(!project.id){
            project.id = id();
        }

        project.name =
            String(project.name || "Speedrun").trim() ||
            "Speedrun";

        if(!Array.isArray(project.segments)){
            project.segments = [];
        }

        project.segments.forEach(segment => {

            if(!segment.id){
                segment.id = id();
            }

            segment.name =
                String(segment.name || "Segment").trim() ||
                "Segment";
        });

        if(project.segments.length === 0){
            project.segments.push({
                id:id(),
                name:"Segment 1"
            });
        }

        if(!Array.isArray(project.history)){
            project.history = [];
        }
    });

    save();
}

function getProject(){
    return data.projects.find(
        project => project.id === activeProjectId
    ) || null;
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   ZEIT
========================================================= */

function timeText(milliseconds){

    milliseconds = Number(milliseconds);

    if(!Number.isFinite(milliseconds) || milliseconds < 0){
        milliseconds = 0;
    }

    const hundredths =
        Math.floor(milliseconds / 10);

    const hh = hundredths % 100;

    const totalSeconds =
        Math.floor(hundredths / 100);

    const seconds =
        totalSeconds % 60;

    const minutes =
        Math.floor(totalSeconds / 60);

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        String(hh).padStart(2,"0")
    );
}

function dateText(timestamp){
    return new Date(timestamp).toLocaleString(
        "de-DE",
        {
            day:"2-digit",
            month:"2-digit",
            year:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    activeProjectId = null;

    const app = document.getElementById("app");

    app.innerHTML = "";

    const main = document.createElement("main");
    main.className = "main";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "Meine Speedruns";

    const subtitle = document.createElement("div");
    subtitle.className = "subtitle";
    subtitle.textContent =
        "Verwalte deine Spiele, Segmente und Runs.";

    const create = document.createElement("button");
    create.type = "button";
    create.className = "button primary";
    create.textContent = "+ Neuer Speedrun";

    create.onclick = createProject;

    const projects = document.createElement("div");
    projects.className = "projects";

    main.append(
        title,
        subtitle,
        create,
        projects
    );

    app.appendChild(main);

    renderProjects(projects);
}

function renderProjects(container){

    container.innerHTML = "";

    if(data.projects.length === 0){

        const empty = document.createElement("div");
        empty.className = "empty";

        empty.innerHTML =
            '<div class="empty-title">Noch keine Speedruns</div>' +
            'Erstelle deinen ersten Speedrun.';

        container.appendChild(empty);

        return;
    }

    data.projects.forEach(project => {

        const card = document.createElement("div");
        card.className = "project";

        const name = document.createElement("div");
        name.className = "project-name";
        name.textContent = project.name;

        const pb = getPB(project);

        const info = document.createElement("div");
        info.className = "project-info";

        info.textContent =
            project.segments.length +
            " Segmente • " +
            project.history.length +
            " Runs • PB: " +
            (pb > 0 ? timeText(pb) : "—");

        const buttons = document.createElement("div");
        buttons.className = "project-buttons";

        const start = makeButton(
            "Starten",
            "primary"
        );

        const edit = makeButton(
            "Bearbeiten",
            ""
        );

        const segments = makeButton(
            "Segmente",
            ""
        );

        const remove = makeButton(
            "Löschen",
            ""
        );

        start.onclick = () => openProject(project.id);

        edit.onclick = () => editProject(project.id);

        segments.onclick = () => {
            openProject(project.id);
            openSegmentEditor();
        };

        remove.onclick = () => deleteProject(project.id);

        buttons.append(
            start,
            edit,
            segments,
            remove
        );

        card.append(
            name,
            info,
            buttons
        );

        container.appendChild(card);
    });
}

function makeButton(text,extraClass){

    const button = document.createElement("button");

    button.type = "button";
    button.className =
        "button small" +
        (extraClass ? " " + extraClass : "");

    button.textContent = text;

    return button;
}


/* =========================================================
   PROJEKT ERSTELLEN
========================================================= */

function createProject(){

    openModal(
        "Neuer Speedrun",
        createProjectForm(),
        function(){

            const input =
                document.getElementById("projectName");

            const name =
                input.value.trim();

            if(!name){
                input.focus();
                return;
            }

            const project = {
                id:id(),
                name:name,
                segments:[
                    {
                        id:id(),
                        name:"Segment 1"
                    }
                ],
                history:[]
            };

            data.projects.push(project);

            save();
            closeModal();

            openProject(project.id);
        }
    );

    setTimeout(() => {
        const input =
            document.getElementById("projectName");

        if(input){
            input.focus();
        }
    },50);
}

function editProject(projectId){

    const project =
        data.projects.find(
            item => item.id === projectId
        );

    if(!project){
        return;
    }

    openModal(
        "Speedrun bearbeiten",
        createProjectForm(project.name),
        function(){

            const input =
                document.getElementById("projectName");

            const name =
                input.value.trim();

            if(!name){
                input.focus();
                return;
            }

            project.name = name;

            save();
            closeModal();

            showHome();
        }
    );

    setTimeout(() => {
        const input =
            document.getElementById("projectName");

        if(input){
            input.focus();
            input.select();
        }
    },50);
}

function createProjectForm(value = ""){

    const wrapper = document.createElement("div");

    const label = document.createElement("label");
    label.className = "form-label";
    label.textContent = "Name des Speedruns";

    const input = document.createElement("input");
    input.id = "projectName";
    input.className = "form-input";
    input.type = "text";
    input.maxLength = 80;
    input.autocomplete = "off";
    input.value = value;
    input.placeholder = "z.B. Game Any%";

    wrapper.append(
        label,
        input
    );

    return wrapper;
}


/* =========================================================
   PROJEKT LÖSCHEN
========================================================= */

function deleteProject(projectId){

    const project =
        data.projects.find(
            item => item.id === projectId
        );

    if(!project){
        return;
    }

    function reallyDelete(){

        data.projects =
            data.projects.filter(
                item => item.id !== projectId
            );

        save();

        showHome();
    }

    if(data.settings.confirmDelete){

        confirmBox(
            "Speedrun löschen?",
            "Der Speedrun und seine gespeicherten Runs werden gelöscht.",
            reallyDelete
        );

    }else{
        reallyDelete();
    }
}


/* =========================================================
   TIMER ÖFFNEN
========================================================= */

function openProject(projectId){

    const project =
        data.projects.find(
            item => item.id === projectId
        );

    if(!project){
        return;
    }

    activeProjectId = projectId;

    resetTimerState();

    renderTimer();
}

function resetTimerState(){

    const project = getProject();

    if(!project){
        return;
    }

    timer = {
        running:false,
        finished:false,
        currentSegment:0,
        segmentTimes:
            project.segments.map(() => 0),
        segmentStartedAt:0,
        runStartedAt:null
    };
}


/* =========================================================
   TIMER
========================================================= */

function renderTimer(){

    const project = getProject();

    if(!project){
        showHome();
        return;
    }

    const app =
        document.getElementById("app");

    app.innerHTML = "";

    const main =
        document.createElement("main");

    main.className = "main";

    const header =
        document.createElement("div");

    header.className = "timer-header";

    const name =
        document.createElement("div");

    name.className = "timer-name";
    name.textContent = project.name;

    const headerButtons =
        document.createElement("div");

    headerButtons.className =
        "timer-header-buttons";

    const segmentButton =
        makeButton("Segmente","");

    const historyButton =
        makeButton("History","");

    const backButton =
        makeButton("Zurück","");

    segmentButton.onclick =
        openSegmentEditor;

    historyButton.onclick = () => {

        const panel =
            document.getElementById("historyPanel");

        if(panel){
            panel.scrollIntoView({
                behavior:"smooth"
            });
        }
    };

    backButton.onclick = leaveTimer;

    headerButtons.append(
        segmentButton,
        historyButton,
        backButton
    );

    header.append(
        name,
        headerButtons
    );


    const timerBox =
        document.createElement("div");

    timerBox.className = "timer-box";

    const timerDisplay =
        document.createElement("div");

    timerDisplay.id = "timerDisplay";
    timerDisplay.className = "timer";
    timerDisplay.textContent =
        timeText(getCurrentElapsed());

    const status =
        document.createElement("div");

    status.id = "timerStatus";
    status.className = "timer-status";

    timerBox.append(
        timerDisplay,
        status
    );


    const compare =
        document.createElement("div");

    compare.className = "compare";

    const currentBox =
        createCompareBox(
            "Segment",
            project.segments[
                timer.currentSegment
            ].name
        );

    const best =
        getBestSegment(
            project,
            timer.currentSegment
        );

    const bestBox =
        createCompareBox(
            "Bestes Segment",
            best > 0 ? timeText(best) : "—"
        );

    const diffBox =
        createCompareBox(
            "Vergleich",
            "—"
        );

    diffBox.id = "diffBox";

    compare.append(
        currentBox,
        bestBox,
        diffBox
    );

function createControl(text,extra){

    const button =
        document.createElement("button");

    button.type = "button";

    button.className =
        "control" +
        (extra ? " " + extra : "");

    button.textContent = text;

    return button;
}

function createCompareBox(label,value){

    const box =
        document.createElement("div");

    box.className =
        "compare-box";

    const labelElement =
        document.createElement("div");

    labelElement.className =
        "compare-label";

    labelElement.textContent =
        label;

    const valueElement =
        document.createElement("div");

    valueElement.className =
        "compare-value";

    valueElement.textContent =
        value;

    box.append(
        labelElement,
        valueElement
    );

    return box;
}

function getCurrentElapsed(){

    if(!timer.running){
        return timer.segmentTimes[
            timer.currentSegment
        ] || 0;
    }

    return performance.now() -
        timer.segmentStartedAt;
}

function startTimer(){

    if(timer.finished){
        return;
    }

    if(timer.running){
        return;
    }

    timer.running = true;
    timer.segmentStartedAt =
        performance.now();

    if(!timer.runStartedAt){
        timer.runStartedAt = Date.now();
    }

    updateTimerDisplay();

    requestAnimationFrame(liveTimer);
}

function liveTimer(){

    if(!timer.running){
        return;
    }

    updateTimerDisplay();

    requestAnimationFrame(liveTimer);
}

function updateTimerDisplay(){

    const project = getProject();

    if(!project){
        return;
    }

    const display =
        document.getElementById("timerDisplay");

    const status =
        document.getElementById("timerStatus");

    if(display){
        display.textContent =
            timeText(getCurrentElapsed());
    }

    if(status){

        if(timer.finished){

            status.textContent =
                "Lauf beendet";

        }else if(timer.running){

            status.textContent =
                "Läuft • " +
                project.segments[
                    timer.currentSegment
                ].name;

        }else{

            status.textContent =
                "Bereit • " +
                project.segments[
                    timer.currentSegment
                ].name;
        }
    }

    const diffBox =
        document.getElementById("diffBox");

    if(diffBox){

        const value =
            diffBox.querySelector(
                ".compare-value"
            );

        const best =
            getBestSegment(
                project,
                timer.currentSegment
            );

        const current =
            getCurrentElapsed();

        value.className =
            "compare-value neutral";

        if(current > 0 && best > 0){

            const difference =
                current - best;

            value.textContent =
                (difference >= 0 ? "+" : "") +
                timeText(Math.abs(difference));

            if(difference < 0){
                value.className =
                    "compare-value good";
            }

            if(difference > 0){
                value.className =
                    "compare-value bad";
            }
        }else{
            value.textContent = "—";
        }
    }
}

function splitTimer(){

    if(!timer.running){
        startTimer();
        return;
    }

    const project = getProject();

    if(!project){
        return;
    }

    const elapsed =
        getCurrentElapsed();

    timer.segmentTimes[
        timer.currentSegment
    ] = elapsed;

    timer.segmentStartedAt =
        performance.now();

    if(
        timer.currentSegment >=
        project.segments.length - 1
    ){

        timer.running = false;
        timer.finished = true;

        saveRun(true);

        updateTimerDisplay();
        renderSegmentRows();
        renderHistoryRows();

        return;
    }

    timer.currentSegment++;

    updateTimerDisplay();
    renderSegmentRows();
}

function stopTimer(){

    if(!timer.running){
        return;
    }

    const elapsed =
        getCurrentElapsed();

    timer.segmentTimes[
        timer.currentSegment
    ] = elapsed;

    timer.running = false;

    saveRun(false);

    updateTimerDisplay();
    renderSegmentRows();
    renderHistoryRows();
}

function resetTimer(){

    if(
        data.settings.confirmReset &&
        timer.running
    ){

        confirmBox(
            "Timer zurücksetzen?",
            "Nur die aktuellen Segmentzeiten werden auf Null gesetzt.",
            reallyResetTimer
        );

        return;
    }

    reallyResetTimer();
}

function reallyResetTimer(){

    const project = getProject();

    if(!project){
        return;
    }

    timer.running = false;
    timer.finished = false;
    timer.currentSegment = 0;
    timer.segmentTimes =
        project.segments.map(() => 0);
    timer.segmentStartedAt = 0;
    timer.runStartedAt = null;

    updateTimerDisplay();
    renderSegmentRows();
}


/* =========================================================
   RUN SPEICHERN
========================================================= */

function saveRun(completed){

    const project = getProject();

    if(!project){
        return;
    }

    const total =
        timer.segmentTimes.reduce(
            (sum,time) => sum + Number(time || 0),
            0
        );

    if(total <= 0){
        return;
    }

    project.history.unshift({
        id:id(),
        date:Date.now(),
        completed:completed,
        total:total,
        segmentTimes:[
            ...timer.segmentTimes
        ]
    });

    if(project.history.length > 100){
        project.history.length = 100;
    }

    save();
}


/* =========================================================
   BESTZEITEN
========================================================= */

function getBestSegment(project,index){

    let best = Infinity;

    project.history.forEach(run => {

        const value =
            Number(
                run.segmentTimes &&
                run.segmentTimes[index]
                || 0
            );

        if(
            value > 0 &&
            value < best
        ){
            best = value;
        }
    });

    return best === Infinity
        ? 0
        : best;
}

function getPB(project){

    let best = Infinity;

    project.history.forEach(run => {

        if(
            run.completed &&
            run.total > 0 &&
            run.total < best
        ){
            best = run.total;
        }
    });

    return best === Infinity
        ? 0
        : best;
}


/* =========================================================
   SEGMENTE
========================================================= */

function renderSegmentRows(){

    const project = getProject();

    const container =
        document.getElementById(
            "segmentContainer"
        );

    if(!project || !container){
        return;
    }

    container.innerHTML = "";

    project.segments.forEach(
        (segment,index) => {

            const row =
                document.createElement("div");

            row.className =
                "segment-row" +
                (
                    index === timer.currentSegment
                        ? " current"
                        : ""
                );

            const number =
                document.createElement("div");

            number.className =
                "segment-number";

            number.textContent =
                index + 1;

            const name =
                document.createElement("div");

            name.className =
                "segment-name";

            name.textContent =
                segment.name;

            const time =
                document.createElement("div");

            time.className =
                "segment-time";

            time.textContent =
                timeText(
                    timer.segmentTimes[index] || 0
                );

            const best =
                document.createElement("div");

            best.className =
                "segment-best";

            const bestValue =
                getBestSegment(
                    project,
                    index
                );

            best.textContent =
                bestValue > 0
                    ? timeText(bestValue)
                    : "—";

            const diff =
                document.createElement("div");

            diff.className =
                "segment-diff";

            const current =
                timer.segmentTimes[index] || 0;

            if(
                current > 0 &&
                bestValue > 0
            ){

                const difference =
                    current - bestValue;

                diff.textContent =
                    (difference >= 0 ? "+" : "") +
                    timeText(
                        Math.abs(difference)
                    );

                if(difference < 0){
                    diff.classList.add("good");
                }else if(difference > 0){
                    diff.classList.add("bad");
                }else{
                    diff.classList.add("neutral");
                }

            }else{
                diff.textContent = "—";
                diff.classList.add("neutral");
            }

            row.append(
                number,
                name,
                time,
                best,
                diff
            );

            container.appendChild(row);
        }
    );
}

   HISTORY
========================================================= */

function renderHistoryRows(){

    const project = getProject();

    const container =
        document.getElementById(
            "historyContainer"
        );

    if(!project || !container){

    }

    container.innerHTML = "";

    if(project.history.length === 0){

            "var(--muted)";

    }

    const pb = getPB(project);

    project.history
        .slice(0,30)
        .forEach((run,index) => {

            const row =
                document.createElement("div");

            row.className =
                "history-row";

            const number =
                document.createElement("div");

            number.className =
                "history-number";

            number.textContent =
                "#" + (index + 1);

            const date =
                document.createElement("div");

            date.className =
                "history-date";

            date.textContent =
                dateText(run.date);

            const total =
                document.createElement("div");

                timeText(run.total);

                run.completed &&
                run.total === pb

            }

            row.append(
                number,
                date,
                total,
                state
            );

            container.appendChild(row);
        });
}


/* =========================================================
   SEGMENT EDITOR
========================================================= */

function collectEditorNames(){

    const project = getProject();

    if(!project){
        return;
    }

    project.segments.forEach(segment => {

        const input =
            document.getElementById(
                "segmentInput_" + segment.id
            );

        if(input){

            const value =
                input.value.trim();

            segment.name =
                value || "Segment";
        }
    });
}

function openSegmentEditor(focusSegmentId = null){

    const project = getProject();

    if(!project){
        return;
    }

    const background =
        document.createElement("div");

    background.className =
        "modal-background";

    const modal =
        document.createElement("div");

    modal.className = "modal";

    const header =
        document.createElement("div");

    header.className =
        "modal-header";

    const title =
        document.createElement("div");

    title.className =
        "modal-title";

    title.textContent =
        "Segmente bearbeiten";

    const close =
        document.createElement("button");

    close.type = "button";
    close.className =
        "icon-button";

    close.textContent = "×";

    close.onclick =
        closeModal;

    header.append(
        title,
        close
    );


    const body =
        document.createElement("div");

    body.className =
        "modal-body";

    const editor =
        document.createElement("div");

    editor.className =
        "segment-editor";


    project.segments.forEach(
        (segment,index) => {

            const row =
                document.createElement("div");

            row.className =
                "editor-row";

            const number =
                document.createElement("div");

            number.className =
                "editor-number";

            number.textContent =
                index + 1;


            const input =
                document.createElement("input");

            input.type = "text";
            input.className =
                "editor-input";

            input.id =
                "segmentInput_" +
                segment.id;

            input.value =
                String(segment.name || "").trim();

            input.maxLength = 80;
            input.autocomplete = "off";
            input.spellcheck = false;


            const up =
                document.createElement("button");

            up.type = "button";
            up.className =
                "editor-button";

            up.textContent = "↑";

            up.onclick = () => {

                collectEditorNames();

                if(index > 0){

                    swapSegments(
                        index,
                        index - 1
                    );

                    save();

                    openSegmentEditor(
                        segment.id
                    );
                }
            };


            const down =
                document.createElement("button");

            down.type = "button";
            down.className =
                "editor-button";

            down.textContent = "↓";

            down.onclick = () => {

                collectEditorNames();

                if(
                    index <
                    project.segments.length - 1
                ){

                    swapSegments(
                        index,
                        index + 1
                    );

                    save();

                    openSegmentEditor(
                        segment.id
                    );
                }
            };


            const remove =
                document.createElement("button");

            remove.type = "button";
            remove.className =
                "editor-button editor-delete";

            remove.textContent = "×";

            remove.onclick = () => {

                if(
                    project.segments.length <= 1
                ){
                    return;
                }

                collectEditorNames();

                project.segments.splice(
                    index,
                    1
                );

                timer.segmentTimes.splice(
                    index,
                    1
                );

                if(
                    timer.currentSegment >=
                    project.segments.length
                ){
                    timer.currentSegment =
                        project.segments.length - 1;
                }

                save();

                openSegmentEditor();
            };


            row.append(
                number,
                input,
                up,
                down,
                remove
            );

            editor.appendChild(row);
        }
    );


    const add =
        document.createElement("button");

    add.type = "button";
    add.className =
        "button primary add-segment";

    add.textContent =
        "+ Segment hinzufügen";

    add.onclick =
        addSegment;


    body.append(
        editor,
        add
    );


    const footer =
        document.createElement("div");

    footer.className =
        "modal-footer";


    const cancel =
        document.createElement("button");

    cancel.type = "button";
    cancel.className =
        "button";

    cancel.textContent =
        "Abbrechen";

    cancel.onclick =
        closeModal;


    const saveButton =
        document.createElement("button");

    saveButton.type = "button";
    saveButton.className =
        "button primary";

    saveButton.textContent =
        "Speichern";

    saveButton.onclick = () => {

        collectEditorNames();

        save();

        closeModal();

        renderTimer();
    };


    footer.append(
        cancel,
        saveButton
    );


    modal.append(
        header,
        body,
        footer
    );

    background.appendChild(modal);

    document.body.appendChild(
        background
    );

    if(focusSegmentId){

        setTimeout(() => {

            const input =
                document.getElementById(
                    "segmentInput_" +
                    focusSegmentId
                );

            if(input){

                input.focus();
                input.select();
            }

        },50);
    }
}

function addSegment(){

    collectEditorNames();

    const project = getProject();

    if(!project){
        return;
    }

    const segment = {
        id:id(),
        name:"Neues Segment"
    };

    project.segments.push(segment);

    timer.segmentTimes.push(0);

    save();

    openSegmentEditor(
        segment.id
    );
}

function swapSegments(a,b){

    const project = getProject();

    if(!project){
        return;
    }

    const segment =
        project.segments[a];

    project.segments[a] =
        project.segments[b];

    project.segments[b] =
        segment;


    const time =
        timer.segmentTimes[a];

    timer.segmentTimes[a] =
        timer.segmentTimes[b];

    timer.segmentTimes[b] =
        time;


    if(timer.currentSegment === a){

        timer.currentSegment = b;

    }else if(timer.currentSegment === b){

        timer.currentSegment = a;
    }
}

                ".modal-background"
            )
        ){
            return;
        }

        if(!getProject()){
            return;
        }

        const active =
            document.activeElement;

        if(
            active &&
            (
                active.tagName === "INPUT" ||
                active.tagName === "TEXTAREA"
            )
        ){
            return;
        }

        if(event.code === "Space"){

            event.preventDefault();

            if(timer.running){
                splitTimer();
            }else{
                startTimer();
            }
        }

        if(
            event.key.toLowerCase() === "r"
        ){
            resetTimer();
        }
    }
);


/* =========================================================
   START
========================================================= */

load();
showHome();

</script>
