<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speedrun Timer</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101114;
    color:#f2f2f2;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
}

.screen{
    min-height:100vh;
    padding:18px;
}

.hidden{
    display:none !important;
}

/* HOME */

.home-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.subtitle{
    color:#888;
    font-size:13px;
    margin-top:4px;
}

.primary-button{
    border:0;
    border-radius:10px;
    background:#e8e8e8;
    color:#111;
    padding:12px 17px;
    font-weight:700;
}

.primary-button:active{
    transform:scale(.97);
}

.project-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    border:1px dashed #444;
    border-radius:12px;
    padding:30px 15px;
    text-align:center;
    color:#777;
}

.project-card{
    background:#191b20;
    border:1px solid #292c33;
    border-radius:14px;
    padding:15px;
}

.project-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.project-name{
    font-size:18px;
    font-weight:700;
}

.project-info{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.project-actions{
    display:flex;
    gap:7px;
    margin-top:14px;
}

.small-button{
    border:1px solid #333;
    background:#22252b;
    color:#ddd;
    border-radius:8px;
    padding:8px 11px;
    font-size:13px;
}

.small-button.danger{
    color:#ff7777;
}

/* FORMS */

.form-box{
    max-width:650px;
    margin:0 auto;
    background:#191b20;
    border:1px solid #292c33;
    border-radius:15px;
    padding:18px;
}

.form-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:18px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:13px;
    color:#999;
    margin-bottom:7px;
}

.field input{
    width:100%;
    border:1px solid #343740;
    background:#111318;
    color:#fff;
    border-radius:9px;
    padding:12px;
    outline:none;
}

.field input:focus{
    border-color:#777;
}

.form-actions{
    display:flex;
    gap:9px;
    margin-top:18px;
}

.form-actions button{
    flex:1;
}

.segment-editor{
    margin-top:20px;
}

.segment-editor-title{
    font-size:14px;
    color:#aaa;
    margin-bottom:10px;
}

.edit-segment-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.edit-segment-row input{
    flex:1;
}

.segment-number{
    width:30px;
    color:#666;
    text-align:center;
}

.remove-segment{
    width:38px;
    height:42px;
    border-radius:8px;
    border:1px solid #333;
    background:#22252b;
    color:#ff7777;
}

.add-segment{
    width:100%;
    margin-top:5px;
    padding:11px;
    border-radius:9px;
    border:1px dashed #444;
    background:#15171b;
    color:#aaa;
}

/* TIMER */

.timer-screen{
    padding:0;
}

.timer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 16px;
    border-bottom:1px solid #25272d;
    background:#121318;
    position:sticky;
    top:0;
    z-index:10;
}

.timer-title{
    font-weight:800;
    font-size:18px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.back-button{
    border:1px solid #333;
    background:#202228;
    color:#ddd;
    border-radius:8px;
    padding:8px 11px;
}

.timer-content{
    max-width:900px;
    margin:0 auto;
    padding:20px 15px 160px;
}

.big-time{
    font-family:"Courier New",monospace;
    font-size:clamp(46px,14vw,90px);
    font-weight:700;
    text-align:center;
    letter-spacing:-3px;
    margin:10px 0 24px;
    color:#f5f5f5;
}

.run-status{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:-15px;
    margin-bottom:20px;
}

.segment-list{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.segment-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:15px;
    align-items:center;
    padding:11px 12px;
    border-radius:7px;
    background:#17191e;
}

.segment-row.current{
    background:#25282f;
}

.segment-row.finished{
    color:#ddd;
}

.segment-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.segment-time{
    font-family:"Courier New",monospace;
    font-size:15px;
    color:#aaa;
}

.segment-row.current .segment-time{
    color:#fff;
}

.history-section{
    margin-top:35px;
}

.section-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:10px;
}

.history-empty{
    color:#666;
    font-size:13px;
    padding:15px 0;
}

.history-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    padding:10px 12px;
    border-bottom:1px solid #24262c;
}

.history-date{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

.history-time{
    font-family:"Courier New",monospace;
    font-weight:700;
}

/* CONTROLS */

.controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:20;
    padding:10px;
    background:rgba(15,16,20,.96);
    border-top:1px solid #292b31;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:7px;
}

.control{
    min-height:52px;
    border-radius:10px;
    border:1px solid #34363d;
    background:#202229;
    color:#ddd;
    font-weight:700;
}

.control:active{
    transform:scale(.97);
}

.control.start{
    background:#e8e8e8;
    color:#111;
    border-color:#e8e8e8;
}

.control.split{
    background:#272a31;
    color:#fff;
}

.control.stop{
    background:#292b31;
    color:#fff;
}

.control:disabled{
    opacity:.4;
    cursor:default;
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    width:min(430px,100%);
    background:#1b1d22;
    border:1px solid #33363d;
    border-radius:15px;
    padding:20px;
}

.modal-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:8px;
}

.modal-text{
    color:#999;
    font-size:14px;
    line-height:1.5;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.modal-actions button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1px solid #333;
    background:#25272d;
    color:#ddd;
}

.modal-actions .confirm{
    background:#eee;
    color:#111;
}

@media(max-width:600px){
    .screen{
        padding:14px;
    }

    .home-header{
        align-items:flex-start;
    }

    .primary-button{
        padding:10px 12px;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .control{
        min-height:50px;
    }

    .timer-content{
        padding-bottom:145px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const STORAGE_KEY = "speedrun_timer_final_v2";

let data = {
    projects: [],
    settings: {
        confirmReset: true,
        confirmDelete: true
    }
};

let activeProjectId = null;

let timer = {
    running: false,
    finished: false,
    currentSegment: 0,
    segmentTimes: [],
    segmentStartedAt: 0,
    runStartedAt: null
};


/* =========================
   BASIC UTILITIES
========================= */

function id(){
    return Math.random().toString(36).slice(2,9);
}

function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function load(){
    try{
        const stored = localStorage.getItem(STORAGE_KEY);

        if(stored){
            const parsed = JSON.parse(stored);

            if(parsed && Array.isArray(parsed.projects)){
                data = parsed;
            }
        }
    }catch(error){
        console.log("Save data konnte nicht geladen werden.");
    }

    normalize();
}

function normalize(){
    if(!Array.isArray(data.projects)){
        data.projects = [];
    }

    if(!data.settings){
        data.settings = {};
    }

    if(typeof data.settings.confirmReset !== "boolean"){
        data.settings.confirmReset = true;
    }

    if(typeof data.settings.confirmDelete !== "boolean"){
        data.settings.confirmDelete = true;
    }

    data.projects.forEach(project => {
        if(!Array.isArray(project.segments)){
            project.segments = [];
        }

        if(!Array.isArray(project.history)){
            project.history = [];
        }

        project.segments = project.segments.map(segment => {
            if(typeof segment === "string"){
                return {
                    id:id(),
                    name:segment
                };
            }

            return {
                id:segment.id || id(),
                name:segment.name || "Segment"
            };
        });
    });

    save();
}

function getProject(){
    return data.projects.find(project => project.id === activeProjectId);
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function timeText(milliseconds){
    if(!Number.isFinite(milliseconds)){
        milliseconds = 0;
    }

    milliseconds = Math.max(0,milliseconds);

    const totalMs = Math.floor(milliseconds);
    const minutes = Math.floor(totalMs / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const ms = totalMs % 1000;

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        String(ms).padStart(3,"0")
    );
}

function dateText(timestamp){
    if(!timestamp){
        return "";
    }

    return new Date(timestamp).toLocaleString("de-DE",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}


/* =========================
   APP START
========================= */

load();
showHome();


/* =========================
   HOME
========================= */

function showHome(){
    activeProjectId = null;

    const app = document.getElementById("app");

    app.innerHTML = `
        <div class="screen">
            <div class="home-header">
                <div>
                    <div class="logo">Speedrun Timer</div>
                    <div class="subtitle">Runs · Segmente · Zeiten</div>
                </div>

                <button class="primary-button" id="newProjectButton">
                    + Speedrun
                </button>
            </div>

            <div class="project-list" id="projectList"></div>
        </div>
    `;

    document
        .getElementById("newProjectButton")
        .onclick = () => createProjectForm();

    renderProjects();
}

function renderProjects(){
    const container = document.getElementById("projectList");

    if(!container){
        return;
    }

    if(data.projects.length === 0){
        container.innerHTML = `
            <div class="empty">
                Noch kein Speedrun vorhanden.<br><br>
                Erstelle deinen ersten Run.
            </div>
        `;
        return;
    }

    container.innerHTML = "";

    data.projects.forEach(project => {
        const card = document.createElement("div");
        card.className = "project-card";

        card.innerHTML = `
            <div class="project-top">
                <div>
                    <div class="project-name">
                        ${escapeHtml(project.name)}
                    </div>

                    <div class="project-info">
                        ${project.segments.length} Segmente
                        · ${project.history.length} Runs
                    </div>
                </div>
            </div>

            <div class="project-actions">
                <button class="small-button open">
                    Starten
                </button>

                <button class="small-button edit">
                    Bearbeiten
                </button>

                <button class="small-button danger delete">
                    Löschen
                </button>
            </div>
        `;

        card.querySelector(".open").onclick = () => {
            openProject(project.id);
        };

        card.querySelector(".edit").onclick = () => {
            editProject(project.id);
        };

        card.querySelector(".delete").onclick = () => {
            deleteProject(project.id);
        };

        container.appendChild(card);
    });
}


/* =========================
   PROJECT CREATION
========================= */

function createProjectForm(){
    renderProjectForm(null);
}

function editProject(projectId){
    const project = data.projects.find(item => item.id === projectId);

    if(!project){
        return;
    }

    renderProjectForm(project);
}

function renderProjectForm(project){
    const isEdit = !!project;

    const app = document.getElementById("app");

    app.innerHTML = `
        <div class="screen">

            <div class="form-box">

                <div class="form-title">
                    ${isEdit ? "Speedrun bearbeiten" : "Neuer Speedrun"}
                </div>

                <div class="field">
                    <label for="projectName">
                        Name
                    </label>

                    <input
                        id="projectName"
                        type="text"
                        autocomplete="off"
                        placeholder="z. B. Any% No Major Glitches"
                        value="${isEdit ? escapeHtml(project.name) : ""}"
                    >
                </div>

                <div class="segment-editor">

                    <div class="segment-editor-title">
                        Segmente
                    </div>

                    <div id="segmentEditor"></div>

                    <button class="add-segment" id="addSegmentButton">
                        + Segment hinzufügen
                    </button>

                </div>

                <div class="form-actions">

                    <button
                        class="small-button"
                        id="cancelProjectButton"
                    >
                        Abbrechen
                    </button>

                    <button
                        class="primary-button"
                        id="saveProjectButton"
                    >
                        ${isEdit ? "Speichern" : "Erstellen"}
                    </button>

                </div>

            </div>

        </div>
    `;

    const editor = document.getElementById("segmentEditor");

    let segments = [];

    if(isEdit){
        segments = project.segments.map(segment => ({
            id:segment.id,
            name:segment.name
        }));
    }

    if(segments.length === 0){
        segments.push({
            id:id(),
            name:"Segment 1"
        });
    }

    function renderEditor(){
        editor.innerHTML = "";

        segments.forEach((segment,index) => {

            const row = document.createElement("div");
            row.className = "edit-segment-row";

            const number = document.createElement("div");
            number.className = "segment-number";
            number.textContent = index + 1;

            const input = document.createElement("input");
            input.type = "text";
            input.value = segment.name;
            input.autocomplete = "off";

            input.addEventListener("input",() => {
                segment.name = input.value;
            });

            const remove = document.createElement("button");
            remove.className = "remove-segment";
            remove.textContent = "×";

            remove.onclick = () => {

                if(segments.length <= 1){
                    return;
                }

                segments.splice(index,1);
                renderEditor();
            };

            row.appendChild(number);
            row.appendChild(input);
            row.appendChild(remove);

            editor.appendChild(row);
        });
    }

    renderEditor();

    document.getElementById("addSegmentButton").onclick = () => {

        segments.push({
            id:id(),
            name:"Segment " + (segments.length + 1)
        });

        renderEditor();

        const inputs = editor.querySelectorAll("input");

        if(inputs.length){
            inputs[inputs.length - 1].focus();
        }
    };

    document.getElementById("cancelProjectButton").onclick = () => {
        showHome();
    };

    document.getElementById("saveProjectButton").onclick = () => {

        const nameInput = document.getElementById("projectName");

        const name = nameInput.value.trim();

        if(!name){
            nameInput.focus();
            return;
        }

        const cleanSegments = segments
            .map(segment => ({
                id:segment.id || id(),
                name:segment.name.trim()
            }))
            .filter(segment => segment.name.length > 0);

        if(cleanSegments.length === 0){
            return;
        }

        if(isEdit){

            project.name = name;
            project.segments = cleanSegments;

            project.history = Array.isArray(project.history)
                ? project.history
                : [];

        }else{

            data.projects.push({
                id:id(),
                name:name,
                segments:cleanSegments,
                history:[]
            });
        }

        save();
        showHome();
    };
}


/* =========================
   DELETE PROJECT
========================= */

function deleteProject(projectId){

    const project = data.projects.find(item => item.id === projectId);

    if(!project){
        return;
    }

    const doDelete = () => {

        data.projects = data.projects.filter(
            item => item.id !== projectId
        );

        save();
        showHome();
    };

    if(data.settings.confirmDelete){

        confirmBox(
            "Speedrun löschen?",
            "Der Speedrun und seine gespeicherten Runs werden gelöscht.",
            doDelete
        );

    }else{

        doDelete();

    }
}


/* =========================
   OPEN TIMER
========================= */

function openProject(projectId){

    const project = data.projects.find(
        item => item.id === projectId
    );

    if(!project){
        return;
    }

    activeProjectId = projectId;

    resetTimerState();

    renderTimer();
}

function resetTimerState(){

    const project = getProject();

    if(!project){
        return;
    }

    timer = {
        running:false,
        finished:false,
        currentSegment:0,
        segmentTimes:project.segments.map(() => 0),
        segmentStartedAt:0,
        runStartedAt:null
    };
}


/* =========================
   TIMER RENDER
========================= */

function renderTimer(){

    const project = getProject();

    if(!project){
        showHome();
        return;
    }

    const app = document.getElementById("app");

    app.innerHTML = `
        <div class="timer-screen">

            <div class="timer-header">

                <button class="back-button" id="backButton">
                    ← Zurück
                </button>

                <div class="timer-title">
                    ${escapeHtml(project.name)}
                </div>

                <div style="width:68px"></div>

            </div>

            <div class="timer-content">

                <div class="big-time" id="bigTime">
                    00:00.000
                </div>

                <div class="run-status" id="runStatus">
                    Bereit
                </div>

                <div class="segment-list" id="segmentList"></div>

                <div class="history-section">

                    <div class="section-title">
                        Runs
                    </div>

                    <div id="historyList"></div>

                </div>

            </div>

            <div class="controls" id="controls"></div>

        </div>
    `;

    document.getElementById("backButton").onclick = leaveTimer;

    const controls = document.getElementById("controls");

    const start = createControl(
        "Start",
        "start"
    );

    const split = createControl(
        "Split",
        "split"
    );

    const pauseButton = createControl(
        timer.running ? "Stop" : "Stop",
        "stop"
    );

    pauseButton.id = "stopContinueButton";

    if(timer.finished){

        pauseButton.textContent = "Stop";
        pauseButton.disabled = true;

    }else if(timer.running){

        pauseButton.textContent = "Stop";

    }else{

        pauseButton.textContent = "Weiter";

        pauseButton.classList.remove("stop");
        pauseButton.classList.add("start");

    }

    const reset = createControl(
        "Reset",
        ""
    );

    start.onclick = startTimer;
    split.onclick = splitTimer;

    if(timer.running){
        pauseButton.onclick = stopTimer;
    }else{
        pauseButton.onclick = continueTimer;
    }

    reset.onclick = resetTimer;

    controls.appendChild(start);
    controls.appendChild(split);
    controls.appendChild(pauseButton);
    controls.appendChild(reset);

    updateTimerDisplay();
    renderSegmentRows();
    renderHistoryRows();
}

function createControl(text,className){

    const button = document.createElement("button");

    button.className = "control";

    if(className){
        button.classList.add(className);
    }

    button.textContent = text;

    return button;
}


/* =========================
   TIMER CALCULATION
========================= */

function getCurrentElapsed(){

    if(!timer.running){
        return timer.segmentTimes[timer.currentSegment] || 0;
    }

    return performance.now() - timer.segmentStartedAt;
}


/* =========================
   START
========================= */

function startTimer(){

    if(timer.finished){
        return;
    }

    if(timer.running){
        return;
    }

    const hasTime = timer.segmentTimes.some(
        value => value > 0
    );

    if(hasTime){
        continueTimer();
        return;
    }

    timer.running = true;

    timer.segmentStartedAt = performance.now();

    if(!timer.runStartedAt){
        timer.runStartedAt = Date.now();
    }

    updateStopButton();
    updateTimerDisplay();

    requestAnimationFrame(liveTimer);
}


/* =========================
   CONTINUE
========================= */

function continueTimer(){

    if(timer.running){
        return;
    }

    if(timer.finished){
        return;
    }

    const project = getProject();

    if(!project){
        return;
    }

    const alreadyElapsed =
        timer.segmentTimes[timer.currentSegment] || 0;

    timer.running = true;

    timer.segmentStartedAt =
        performance.now() - alreadyElapsed;

    if(!timer.runStartedAt){
        timer.runStartedAt = Date.now();
    }

    updateStopButton();
    updateTimerDisplay();

    requestAnimationFrame(liveTimer);
}


/* =========================
   LIVE TIMER
========================= */

function liveTimer(){

    if(!timer.running){
        return;
    }

    updateTimerDisplay();

    requestAnimationFrame(liveTimer);
}


/* =========================
   SPLIT
========================= */

function splitTimer(){

    if(!timer.running){
        startTimer();
        return;
    }

    const project = getProject();

    if(!project){
        return;
    }

    const elapsed = getCurrentElapsed();

    timer.segmentTimes[timer.currentSegment] = elapsed;

    if(timer.currentSegment >= project.segments.length - 1){

        timer.running = false;
        timer.finished = true;

        saveRun(true);

        updateStopButton();
        updateTimerDisplay();
        renderSegmentRows();
        renderHistoryRows();

        return;
    }

    timer.currentSegment++;

    timer.segmentStartedAt = performance.now();

    updateStopButton();
    updateTimerDisplay();
    renderSegmentRows();
}


/* =========================
   STOP / PAUSE
========================= */

function stopTimer(){

    if(!timer.running){
        return;
    }

    const elapsed = getCurrentElapsed();

    timer.segmentTimes[timer.currentSegment] = elapsed;

    timer.running = false;

    /*
        Wichtig:
        Hier wird KEIN Run gespeichert.
        Stop ist nur eine Pause.
    */

    updateStopButton();
    updateTimerDisplay();
    renderSegmentRows();
}


/* =========================
   STOP BUTTON UPDATE
========================= */

function updateStopButton(){

    const button =
        document.getElementById("stopContinueButton");

    if(!button){
        return;
    }

    if(timer.finished){

        button.textContent = "Stop";
        button.disabled = true;

        button.classList.remove("start");
        button.classList.add("stop");

        button.onclick = null;

        return;
    }

    if(timer.running){

        button.textContent = "Stop";

        button.classList.remove("start");
        button.classList.add("stop");

        button.disabled = false;

        button.onclick = stopTimer;

    }else{

        button.textContent = "Weiter";

        button.classList.remove("stop");
        button.classList.add("start");

        button.disabled = false;

        button.onclick = continueTimer;
    }
}


/* =========================
   RESET
========================= */

function resetTimer(){

    if(data.settings.confirmReset && timer.running){

        confirmBox(
            "Timer zurücksetzen?",
            "Nur die aktuellen Segmentzeiten werden auf Null gesetzt.",
            reallyResetTimer
        );

        return;
    }

    reallyResetTimer();
}

function reallyResetTimer(){

    const project = getProject();

    if(!project){
        return;
    }

    timer.running = false;
    timer.finished = false;
    timer.currentSegment = 0;
    timer.segmentTimes = project.segments.map(() => 0);
    timer.segmentStartedAt = 0;
    timer.runStartedAt = null;

    updateStopButton();
    updateTimerDisplay();
    renderSegmentRows();
}


/* =========================
   DISPLAY
========================= */

function updateTimerDisplay(){

    const bigTime = document.getElementById("bigTime");
    const status = document.getElementById("runStatus");

    if(!bigTime){
        return;
    }

    let total = 0;

    timer.segmentTimes.forEach(value => {
        total += value || 0;
    });

    if(timer.running){

        total -= timer.segmentTimes[timer.currentSegment] || 0;
        total += getCurrentElapsed();

    }

    bigTime.textContent = timeText(total);

    if(status){

        if(timer.finished){
            status.textContent = "Run abgeschlossen";

        }else if(timer.running){

            status.textContent =
                "Segment " +
                (timer.currentSegment + 1) +
                " läuft";

        }else if(total > 0){

            status.textContent = "Pausiert";

        }else{

            status.textContent = "Bereit";
        }
    }
}


/* =========================
   SEGMENTS
========================= */

function renderSegmentRows(){

    const project = getProject();

    const container =
        document.getElementById("segmentList");

    if(!project || !container){
        return;
    }

    container.innerHTML = "";

    project.segments.forEach((segment,index) => {

        let segmentTime =
            timer.segmentTimes[index] || 0;

        if(
            timer.running &&
            index === timer.currentSegment
        ){
            segmentTime = getCurrentElapsed();
        }

        const row =
            document.createElement("div");

        row.className = "segment-row";

        if(index === timer.currentSegment && !timer.finished){
            row.classList.add("current");
        }

        if(index < timer.currentSegment){
            row.classList.add("finished");
        }

        const name =
            document.createElement("div");

        name.className = "segment-name";
        name.textContent = segment.name;

        const time =
            document.createElement("div");

        time.className = "segment-time";
        time.textContent = timeText(segmentTime);

        row.appendChild(name);
        row.appendChild(time);

        container.appendChild(row);
    });
}


/* =========================
   SAVE RUN
========================= */

function saveRun(completed){

    const project = getProject();

    if(!project){
        return;
    }

    let total = 0;

    timer.segmentTimes.forEach(value => {
        total += value || 0;
    });

    project.history.unshift({
        id:id(),
        timestamp:Date.now(),
        total:total,
        segments:[...timer.segmentTimes],
        completed:completed
    });

    /*
        Maximal 100 Runs behalten.
    */

    if(project.history.length > 100){
        project.history =
            project.history.slice(0,100);
    }

    save();
}


/* =========================
   HISTORY
========================= */

function renderHistoryRows(){

    const project = getProject();

    const container =
        document.getElementById("historyList");

    if(!project || !container){
        return;
    }

    container.innerHTML = "";

    if(project.history.length === 0){

        container.innerHTML = `
            <div class="history-empty">
                Noch keine abgeschlossenen Runs.
            </div>
        `;

        return;
    }

    project.history.forEach((run,index) => {

        const row =
            document.createElement("div");

        row.className = "history-row";

        const left =
            document.createElement("div");

        const title =
            document.createElement("div");

        title.textContent =
            "Run " + (project.history.length - index);

        const date =
            document.createElement("div");

        date.className = "history-date";
        date.textContent = dateText(run.timestamp);

        left.appendChild(title);
        left.appendChild(date);

        const right =
            document.createElement("div");

        right.className = "history-time";
        right.textContent = timeText(run.total);

        row.appendChild(left);
        row.appendChild(right);

        container.appendChild(row);
    });
}


/* =========================
   LEAVE TIMER
========================= */

function leaveTimer(){

    if(timer.running){

        confirmBox(
            "Timer verlassen?",
            "Der aktuelle Timer läuft noch. Beim Verlassen geht der aktuelle Lauf verloren.",
            () => showHome()
        );

        return;
    }

    showHome();
}


/* =========================
   CONFIRM MODAL
========================= */

function confirmBox(title,text,onConfirm){

    const existing =
        document.querySelector(".modal-overlay");

    if(existing){
        existing.remove();
    }

    const overlay =
        document.createElement("div");

    overlay.className = "modal-overlay";

    overlay.innerHTML = `
        <div class="modal">

            <div class="modal-title">
                ${escapeHtml(title)}
            </div>

            <div class="modal-text">
                ${escapeHtml(text)}
            </div>

            <div class="modal-actions">

                <button class="cancel">
                    Abbrechen
                </button>

                <button class="confirm">
                    Bestätigen
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(overlay);

    overlay.querySelector(".cancel").onclick = () => {
        overlay.remove();
    };

    overlay.querySelector(".confirm").onclick = () => {
        overlay.remove();
        onConfirm();
    };
}
</script>
