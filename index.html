<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speedrun Timer</title>

<style>
:root{
    --bg:#0b0d12;
    --panel:#121620;
    --panel2:#181d29;
    --border:#293140;
    --text:#f4f6fa;
    --muted:#8992a3;
    --accent:#7c5cff;
    --accent2:#9b85ff;
    --green:#35d07f;
    --red:#ff5570;
    --yellow:#ffd166;
    --blue:#4ca7ff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:#0d1017;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-weight:900;
    letter-spacing:2px;
    font-size:20px;
}

.logo span{
    color:var(--accent2);
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
}

.main{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:22px 16px 50px;
    flex:1;
}

.page-title{
    font-size:27px;
    font-weight:900;
    margin:5px 0 6px;
}

.page-subtitle{
    color:var(--muted);
    margin-bottom:22px;
}

.project-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px;
}

.project-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:17px;
    transition:.15s;
}

.project-card:hover{
    border-color:#3b4558;
    transform:translateY(-1px);
}

.project-card-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:7px;
}

.project-card-meta{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
}

.card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    min-height:42px;
    padding:0 15px;
    border-radius:10px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
    font-weight:700;
}

.btn:hover{
    border-color:#4b566c;
}

.btn.primary{
    background:var(--accent);
    border-color:var(--accent);
}

.btn.primary:hover{
    background:var(--accent2);
}

.btn.green{
    background:var(--green);
    color:#07130c;
    border-color:var(--green);
}

.btn.red{
    background:var(--red);
    color:#21070d;
    border-color:var(--red);
}

.btn.yellow{
    background:var(--yellow);
    color:#201804;
    border-color:var(--yellow);
}

.btn.small{
    min-height:36px;
    padding:0 11px;
    font-size:13px;
}

.empty{
    border:1px dashed var(--border);
    border-radius:16px;
    padding:35px 20px;
    text-align:center;
    color:var(--muted);
}

.empty strong{
    display:block;
    color:var(--text);
    font-size:18px;
    margin-bottom:7px;
}

.timer-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
}

.timer-title{
    font-size:24px;
    font-weight:900;
}

.timer-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.timer-display{
    text-align:center;
    padding:25px 10px 22px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    margin-bottom:12px;
}

.timer-value{
    font-family:"Courier New",monospace;
    font-size:clamp(45px,12vw,90px);
    line-height:1;
    font-weight:700;
    letter-spacing:2px;
}

.timer-status{
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
}

.compare{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:12px;
}

.compare-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:12px;
    min-width:0;
}

.compare-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:6px;
}

.compare-value{
    font-family:"Courier New",monospace;
    font-weight:700;
    font-size:18px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.diff-good{
    color:var(--green);
}

.diff-bad{
    color:var(--red);
}

.diff-neutral{
    color:var(--muted);
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:9px;
    margin-bottom:15px;
}

.control-btn{
    min-height:54px;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-weight:900;
    font-size:15px;
}

.control-btn.start{
    background:var(--green);
    color:#06150d;
    border-color:var(--green);
}

.control-btn.split{
    background:var(--accent);
    border-color:var(--accent);
}

.control-btn.stop{
    background:var(--red);
    color:#21070d;
    border-color:var(--red);
}

.control-btn.reset{
    background:var(--panel2);
}

.segments-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.panel-header{
    min-height:55px;
    padding:10px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
}

.panel-title{
    font-weight:900;
}

.segment-list{
    width:100%;
}

.segment-row{
    min-height:52px;
    display:grid;
    grid-template-columns:38px minmax(0,1fr) 105px 105px 90px;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-bottom:1px solid #202632;
}

.segment-row:last-child{
    border-bottom:0;
}

.segment-row.current{
    background:#171d2a;
}

.segment-number{
    color:var(--muted);
    text-align:center;
    font-size:12px;
}

.segment-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.segment-time,
.segment-best,
.segment-diff{
    text-align:right;
    font-family:"Courier New",monospace;
    font-size:14px;
}

.segment-best{
    color:var(--muted);
}

.history-panel{
    margin-top:15px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.history-row{
    display:grid;
    grid-template-columns:55px 1fr 110px 110px;
    gap:8px;
    padding:12px;
    border-bottom:1px solid #202632;
    align-items:center;
}

.history-row:last-child{
    border-bottom:0;
}

.history-date{
    color:var(--muted);
    font-size:12px;
}

.history-time{
    font-family:"Courier New",monospace;
    font-weight:700;
}

.pb{
    color:var(--yellow);
    font-weight:900;
}

.footer{
    color:var(--muted);
    font-size:12px;
    text-align:center;
    padding:18px 12px 30px;
}

.modal-root{
    position:fixed;
    inset:0;
    z-index:100;
}

.modal-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.modal-header{
    padding:17px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.modal-title{
    font-size:20px;
    font-weight:900;
}

.modal-body{
    padding:17px;
}

.modal-footer{
    padding:14px 17px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    color:var(--muted);
    font-size:13px;
}

.form-input{
    width:100%;
    min-height:45px;
    padding:0 12px;
    background:#0d1118;
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    outline:none;
}

.form-input:focus{
    border-color:var(--accent);
}

.segment-editor{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.segment-editor-row{
    display:grid;
    grid-template-columns:35px minmax(0,1fr) auto auto auto;
    gap:6px;
    align-items:center;
}

.segment-editor-number{
    color:var(--muted);
    text-align:center;
    font-size:12px;
}

.segment-editor-input{
    width:100%;
    min-width:0;
    height:42px;
    padding:0 11px;
    border-radius:9px;
    border:1px solid var(--border);
    background:#0c1016;
    color:var(--text);
    outline:none;
}

.segment-editor-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(124,92,255,.15);
}

.segment-editor-btn{
    width:38px;
    height:38px;
    border-radius:8px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
}

.segment-editor-btn.delete{
    color:var(--red);
}

.segment-add-container{
    margin-top:12px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
}

.stat-value{
    font-size:20px;
    font-weight:900;
    margin-top:4px;
}

@media(max-width:700px){
    .segment-row{
        grid-template-columns:30px minmax(0,1fr) 85px;
    }

    .segment-best,
    .segment-diff{
        display:none;
    }

    .history-row{
        grid-template-columns:45px 1fr 90px;
    }

    .history-row .history-date{
        display:none;
    }

    .controls{
        grid-template-columns:1fr 1fr;
    }

    .compare{
        grid-template-columns:1fr 1fr;
    }

    .compare-box:last-child{
        grid-column:1 / -1;
    }
}

@media(max-width:420px){
    .main{
        padding-left:10px;
        padding-right:10px;
    }

    .segment-editor-row{
        grid-template-columns:28px minmax(0,1fr) 34px 34px 34px;
    }

    .segment-editor-btn{
        width:34px;
        height:34px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">SPEED<span>RUN</span></div>

    <div class="header-actions">
        <button class="icon-btn" id="homeBtn" title="Hauptmenü">⌂</button>
        <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙</button>
    </div>
</header>

<main class="main" id="app"></main>

<footer class="footer">
    Speedrun Timer • Alles wird lokal auf diesem Gerät gespeichert
</footer>

</div>

<div id="modalRoot" class="modal-root"></div>

<script>
"use strict";

/* =========================
   DATENBANK
========================= */

const STORAGE_KEY = "speedrun_timer_v3";

let database = {
    projects: [],
    settings: {
        confirmReset: true,
        confirmDelete: true
    }
};

let currentProjectId = null;

let timerState = {
    running: false,
    finished: false,
    currentSegment: 0,
    segmentTimes: [],
    startTime: 0,
    elapsedBeforeStart: 0,
    runStartDate: null
};


/* =========================
   HILFSFUNKTIONEN
========================= */

function createId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

function saveDatabase(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(database));
}

function loadDatabase(){
    try{
        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){
            const parsed = JSON.parse(saved);

            if(parsed && typeof parsed === "object"){
                database = parsed;
            }
        }
    }catch(error){
        console.error("Daten konnten nicht geladen werden.", error);
    }

    normalizeDatabase();
}

function normalizeDatabase(){
    if(!database || typeof database !== "object"){
        database = {};
    }

    if(!Array.isArray(database.projects)){
        database.projects = [];
    }

    if(!database.settings || typeof database.settings !== "object"){
        database.settings = {
            confirmReset:true,
            confirmDelete:true
        };
    }

    database.projects.forEach(project => {

        if(!project.id){
            project.id = createId();
        }

        if(typeof project.name !== "string"){
            project.name = "Speedrun";
        }

        project.name = project.name.trim() || "Speedrun";

        if(!Array.isArray(project.segments)){
            project.segments = [];
        }

        project.segments.forEach(segment => {
            if(!segment.id){
                segment.id = createId();
            }

            if(typeof segment.name !== "string"){
                segment.name = "Segment";
            }

            segment.name = segment.name.trim() || "Segment";
        });

        if(project.segments.length === 0){
            project.segments.push({
                id:createId(),
                name:"Segment 1"
            });
        }

        if(!Array.isArray(project.history)){
            project.history = [];
        }

        project.history = project.history.filter(run => {
            return run && Array.isArray(run.segmentTimes);
        });
    });

    saveDatabase();
}

function getProject(){
    return database.projects.find(p => p.id === currentProjectId) || null;
}

function formatTime(ms){
    if(!Number.isFinite(ms) || ms < 0){
        ms = 0;
    }

    const totalHundredths = Math.floor(ms / 10);

    const hundredths = totalHundredths % 100;
    const totalSeconds = Math.floor(totalHundredths / 100);

    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        String(hundredths).padStart(2,"0")
    );
}

function formatDate(timestamp){
    if(!timestamp){
        return "Unbekannt";
    }

    return new Date(timestamp).toLocaleString("de-DE",{
        day:"2-digit",
        month:"2-digit",
        year:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
    });
}

function escapeHtml(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   TIMER
========================= */

function createTimerState(){
    const project = getProject();

    if(!project){
        return;
    }

    timerState = {
        running:false,
        finished:false,
        currentSegment:0,
        segmentTimes:project.segments.map(() => 0),
        startTime:0,
        elapsedBeforeStart:0,
        runStartDate:null
    };
}

function getCurrentSegmentElapsed(){
    if(!timerState.running){
        return timerState.elapsedBeforeStart;
    }

    return timerState.elapsedBeforeStart + (performance.now() - timerState.startTime);
}

function startTimer(){
    const project = getProject();

    if(!project || timerState.finished){
        return;
    }

    if(timerState.running){
        return;
    }

    timerState.running = true;
    timerState.startTime = performance.now();

    if(!timerState.runStartDate){
        timerState.runStartDate = Date.now();
    }

    renderTimer();
}

function splitTimer(){
    const project = getProject();

    if(!project){
        return;
    }

    if(!timerState.running){
        startTimer();
        return;
    }

    const elapsed = getCurrentSegmentElapsed();

    timerState.segmentTimes[timerState.currentSegment] = elapsed;

    timerState.elapsedBeforeStart = 0;
    timerState.startTime = performance.now();

    if(timerState.currentSegment >= project.segments.length - 1){
        finishRun();
        return;
    }

    timerState.currentSegment++;

    renderTimer();
}

function stopTimer(){
    const project = getProject();

    if(!project || !timerState.running){
        return;
    }

    const elapsed = getCurrentSegmentElapsed();

    timerState.segmentTimes[timerState.currentSegment] = elapsed;

    timerState.elapsedBeforeStart = elapsed;
    timerState.startTime = 0;
    timerState.running = false;

    saveRun(false);

    renderTimer();
}

function finishRun(){
    timerState.running = false;
    timerState.finished = true;
    timerState.elapsedBeforeStart = 0;
    timerState.startTime = 0;

    saveRun(true);

    renderTimer();
}

function resetTimer(force = false){
    const project = getProject();

    if(!project){
        return;
    }

    if(
        database.settings.confirmReset &&
        timerState.running &&
        !force
    ){
        openConfirm(
            "Timer zurücksetzen?",
            "Der aktuelle Lauf wird verworfen. Die Segmente und gespeicherten Runs bleiben erhalten.",
            () => resetTimer(true)
        );

        return;
    }

    timerState.running = false;
    timerState.finished = false;
    timerState.currentSegment = 0;
    timerState.segmentTimes = project.segments.map(() => 0);
    timerState.startTime = 0;
    timerState.elapsedBeforeStart = 0;
    timerState.runStartDate = null;

    renderTimer();
}

function saveRun(completed){
    const project = getProject();

    if(!project){
        return;
    }

    const times = timerState.segmentTimes.map(time => {
        return Number.isFinite(time) ? time : 0;
    });

    const total = times.reduce((sum,time) => sum + time,0);

    if(total <= 0){
        return;
    }

    project.history.unshift({
        id:createId(),
        date:Date.now(),
        segmentTimes:times,
        total:total,
        completed:completed
    });

    if(project.history.length > 100){
        project.history = project.history.slice(0,100);
    }

    saveDatabase();
}


/* =========================
   BESTZEITEN
========================= */

function getBestSegment(project,index){
    let best = Infinity;

    project.history.forEach(run => {
        const time = Number(run.segmentTimes[index] || 0);

        if(time > 0 && time < best){
            best = time;
        }
    });

    return best === Infinity ? 0 : best;
}

function getPB(project){
    let best = Infinity;

    project.history.forEach(run => {
        if(run.completed && run.total > 0 && run.total < best){
            best = run.total;
        }
    });

    return best === Infinity ? 0 : best;
}

function getSumOfBest(project){
    let total = 0;

    project.segments.forEach((segment,index) => {
        const best = getBestSegment(project,index);

        if(best > 0){
            total += best;
        }
    });

    return total;
}

function getSegmentDiff(project,index){
    const current = timerState.segmentTimes[index] || 0;
    const best = getBestSegment(project,index);

    if(current <= 0 || best <= 0){
        return null;
    }

    return current - best;
}


/* =========================
   HAUPTMENÜ
========================= */

function renderHome(){
    currentProjectId = null;

    const app = document.getElementById("app");

    app.innerHTML = `
        <div class="page-title">Meine Speedruns</div>
        <div class="page-subtitle">
            Erstelle Speedruns, verwalte Segmente und verbessere deine Bestzeiten.
        </div>

        <div style="margin-bottom:16px;">
            <button class="btn primary" id="newProjectBtn">
                + Neuer Speedrun
            </button>
        </div>

        <div id="projectGrid" class="project-grid"></div>
    `;

    document.getElementById("newProjectBtn").onclick = () => {
        openProjectModal();
    };

    renderProjectCards();
}

function renderProjectCards(){
    const container = document.getElementById("projectGrid");

    if(!container){
        return;
    }

    if(database.projects.length === 0){
        container.innerHTML = `
            <div class="empty">
                <strong>Noch keine Speedruns</strong>
                Erstelle deinen ersten Speedrun und füge danach deine Segmente hinzu.
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    database.projects.forEach(project => {

        const card = document.createElement("div");
        card.className = "project-card";

        const pb = getPB(project);

        card.innerHTML = `
            <div class="project-card-title">${escapeHtml(project.name)}</div>

            <div class="project-card-meta">
                ${project.segments.length} Segmente
                • ${project.history.length} Runs
                • PB: ${pb > 0 ? formatTime(pb) : "—"}
            </div>

            <div class="card-actions">
                <button class="btn primary small open-project">
                    Starten
                </button>

                <button class="btn small edit-project">
                    Bearbeiten
                </button>

                <button class="btn small segment-project">
                    Segmente
                </button>

                <button class="btn small delete-project">
                    Löschen
                </button>
            </div>
        `;

        card.querySelector(".open-project").onclick = () => {
            openProject(project.id);
        };

        card.querySelector(".edit-project").onclick = () => {
            openProjectModal(project);
        };

        card.querySelector(".segment-project").onclick = () => {
            openProject(project.id);
            openSegmentEditor();
        };

        card.querySelector(".delete-project").onclick = () => {
            deleteProject(project.id);
        };

        container.appendChild(card);
    });
}


/* =========================
   PROJEKT ÖFFNEN
========================= */

function openProject(id){
    const project = database.projects.find(p => p.id === id);

    if(!project){
        return;
    }

    currentProjectId = id;

    createTimerState();

    renderTimer();
}


/* =========================
   TIMER SEITE
========================= */

function renderTimer(){
    const project = getProject();

    if(!project){
        renderHome();
        return;
    }

    const app = document.getElementById("app");

    const currentName =
        project.segments[timerState.currentSegment]?.name ||
        "Segment";

    const currentElapsed = timerState.running
        ? getCurrentSegmentElapsed()
        : timerState.segmentTimes[timerState.currentSegment] || 0;

    const bestCurrent = getBestSegment(
        project,
        timerState.currentSegment
    );

    let compareText = "—";
    let compareClass = "diff-neutral";

    if(currentElapsed > 0 && bestCurrent > 0){
        const diff = currentElapsed - bestCurrent;

        compareText = (diff >= 0 ? "+" : "") + formatTime(Math.abs(diff));

        if(diff < 0){
            compareClass = "diff-good";
        }else if(diff > 0){
            compareClass = "diff-bad";
        }else{
            compareClass = "diff-neutral";
        }
    }

    app.innerHTML = `
        <div class="timer-top">
            <div>
                <div class="timer-title">${escapeHtml(project.name)}</div>
            </div>

            <div class="timer-actions">
                <button class="btn small" id="editSegmentsBtn">
                    Segmente
                </button>

                <button class="btn small" id="historyBtn">
                    History
                </button>

                <button class="btn small" id="backHomeBtn">
                    Zurück
                </button>
            </div>
        </div>

        <div class="timer-display">
            <div class="timer-value" id="mainTimer">
                ${formatTime(currentElapsed)}
            </div>

            <div class="timer-status">
                ${timerState.finished
                    ? "Lauf beendet"
                    : timerState.running
                        ? "Läuft • " + escapeHtml(currentName)
                        : "Bereit • " + escapeHtml(currentName)
                }
            </div>
        </div>

        <div class="compare">
            <div class="compare-box">
                <div class="compare-label">Segment</div>
                <div class="compare-value">
                    ${escapeHtml(currentName)}
                </div>
            </div>

            <div class="compare-box">
                <div class="compare-label">Bestes Segment</div>
                <div class="compare-value">
                    ${bestCurrent > 0 ? formatTime(bestCurrent) : "—"}
                </div>
            </div>

            <div class="compare-box">
                <div class="compare-label">Vergleich</div>
                <div class="compare-value ${compareClass}">
                    ${compareText}
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn start" id="startBtn">
                Start
            </button>

            <button class="control-btn split" id="splitBtn">
                Split
            </button>

            <button class="control-btn stop" id="stopBtn">
                Stop
            </button>

            <button class="control-btn reset" id="resetBtn">
                Reset
            </button>
        </div>

        <div class="segments-panel">
            <div class="panel-header">
                <div class="panel-title">Segmente</div>

                <button class="btn small" id="editSegmentsBtn2">
                    Bearbeiten
                </button>
            </div>

            <div class="segment-list" id="segmentList"></div>
        </div>

        <div class="history-panel">
            <div class="panel-header">
                <div class="panel-title">
                    Runs
                </div>

                <div style="color:var(--muted);font-size:12px;">
                    PB: ${getPB(project) > 0 ? formatTime(getPB(project)) : "—"}
                </div>
            </div>

            <div id="historyList"></div>
        </div>
    `;

    document.getElementById("startBtn").onclick = startTimer;
    document.getElementById("splitBtn").onclick = splitTimer;
    document.getElementById("stopBtn").onclick = stopTimer;

    document.getElementById("resetBtn").onclick = () => {
        resetTimer(false);
    };

    document.getElementById("editSegmentsBtn").onclick = openSegmentEditor;
    document.getElementById("editSegmentsBtn2").onclick = openSegmentEditor;

    document.getElementById("historyBtn").onclick = () => {
        const history = document.querySelector(".history-panel");

        if(history){
            history.scrollIntoView({
                behavior:"smooth"
            });
        }
    };

    document.getElementById("backHomeBtn").onclick = () => {
        if(timerState.running){
            openConfirm(
                "Lauf verlassen?",
                "Der aktuelle Lauf läuft gerade.",
                () => renderHome()
            );
        }else{
            renderHome();
        }
    };

    renderSegmentList();
    renderHistory();

    if(timerState.running){
        requestAnimationFrame(updateLiveTimer);
    }
}

function updateLiveTimer(){
    if(!timerState.running){
        return;
    }

    const timer = document.getElementById("mainTimer");

    if(timer){
        timer.textContent = formatTime(
            getCurrentSegmentElapsed()
        );
    }

    const currentBest = document.querySelector(".compare-value:nth-child(2)");

    requestAnimationFrame(updateLiveTimer);
}


/* =========================
   SEGMENT LISTE
========================= */

function renderSegmentList(){
    const project = getProject();
    const container = document.getElementById("segmentList");

    if(!project || !container){
        return;
    }

    container.innerHTML = "";

    project.segments.forEach((segment,index) => {

        const row = document.createElement("div");

        row.className =
            "segment-row" +
            (index === timerState.currentSegment
                ? " current"
                : "");

        const number = document.createElement("div");
        number.className = "segment-number";
        number.textContent = index + 1;

        const name = document.createElement("div");
        name.className = "segment-name";
        name.textContent = segment.name;

        const time = document.createElement("div");
        time.className = "segment-time";
        time.textContent = formatTime(
            timerState.segmentTimes[index] || 0
        );

        const best = document.createElement("div");
        best.className = "segment-best";

        const bestTime = getBestSegment(project,index);

        best.textContent =
            bestTime > 0
                ? formatTime(bestTime)
                : "—";

        const diff = document.createElement("div");
        diff.className = "segment-diff";

        const difference = getSegmentDiff(project,index);

        if(difference === null){
            diff.textContent = "—";
            diff.classList.add("diff-neutral");
        }else{
            diff.textContent =
                (difference >= 0 ? "+" : "") +
                formatTime(Math.abs(difference));

            diff.classList.add(
                difference < 0
                    ? "diff-good"
                    : difference > 0
                        ? "diff-bad"
                        : "diff-neutral"
            );
        }

        row.append(
            number,
            name,
            time,
            best,
            diff
        );

        container.appendChild(row);
    });
}


/* =========================
   HISTORY
========================= */

function renderHistory(){
    const project = getProject();
    const container = document.getElementById("historyList");

    if(!project || !container){
        return;
    }

    if(project.history.length === 0){
        container.innerHTML = `
            <div style="padding:20px;text-align:center;color:var(--muted);">
                Noch keine Runs aufgenommen.
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    project.history.slice(0,20).forEach((run,index) => {

        const row = document.createElement("div");
        row.className = "history-row";

        const number = document.createElement("div");
        number.textContent = "#" + (index + 1);
        number.style.color = "var(--muted)";
        number.style.fontSize = "12px";

        const date = document.createElement("div");
        date.className = "history-date";
        date.textContent = formatDate(run.date);

        const total = document.createElement("div");
        total.className = "history-time";
        total.textContent = formatTime(run.total);

        const status = document.createElement("div");

        if(run.completed){
            status.textContent = "FINISH";
            status.style.color = "var(--green)";
            status.style.fontWeight = "900";
        }else{
            status.textContent = "STOP";
            status.style.color = "var(--muted)";
            status.style.fontWeight = "900";
        }

        const pb = getPB(project);

        if(run.completed && run.total === pb){
            total.classList.add("pb");
        }

        row.append(
            number,
            date,
            total,
            status
        );

        container.appendChild(row);
    });
}


/* =========================
   SEGMENT EDITOR
   DOM-BASIERT
========================= */

function collectSegmentEditorNames(){
    const project = getProject();

    if(!project){
        return;
    }

    project.segments.forEach(segment => {

        const input = document.getElementById(
            "segmentInput_" + segment.id
        );

        if(input){
            const value = input.value.trim();

            segment.name = value || "Segment";
        }
    });
}

function openSegmentEditor(focusId = null){
    const project = getProject();

    if(!project){
        return;
    }

    const root = document.getElementById("modalRoot");

    root.replaceChildren();

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    const modal = document.createElement("div");
    modal.className = "modal";

    const header = document.createElement("div");
    header.className = "modal-header";

    const title = document.createElement("div");
    title.className = "modal-title";
    title.textContent = "Segmente bearbeiten";

    const closeButton = document.createElement("button");
    closeButton.className = "icon-btn";
    closeButton.textContent = "×";

    header.append(title,closeButton);

    const body = document.createElement("div");
    body.className = "modal-body";

    const editor = document.createElement("div");
    editor.className = "segment-editor";

    project.segments.forEach((segment,index) => {

        const row = document.createElement("div");
        row.className = "segment-editor-row";

        const number = document.createElement("div");
        number.className = "segment-editor-number";
        number.textContent = index + 1;

        const input = document.createElement("input");
        input.type = "text";
        input.className = "segment-editor-input";
        input.id = "segmentInput_" + segment.id;
        input.value = String(segment.name || "").trim();
        input.maxLength = 80;
        input.autocomplete = "off";
        input.spellcheck = false;

        const up = document.createElement("button");
        up.className = "segment-editor-btn";
        up.textContent = "↑";
        up.title = "Nach oben";

        const down = document.createElement("button");
        down.className = "segment-editor-btn";
        down.textContent = "↓";
        down.title = "Nach unten";

        const remove = document.createElement("button");
        remove.className = "segment-editor-btn delete";
        remove.textContent = "×";
        remove.title = "Segment löschen";

        up.onclick = () => {
            moveSegment(index,-1);
        };

        down.onclick = () => {
            moveSegment(index,1);
        };

        remove.onclick = () => {
            removeSegment(index);
        };

        row.append(
            number,
            input,
            up,
            down,
            remove
        );

        editor.appendChild(row);
    });

    const addContainer = document.createElement("div");
    addContainer.className = "segment-add-container";

    const addButton = document.createElement("button");
    addButton.className = "btn primary";
    addButton.textContent = "+ Segment hinzufügen";

    addButton.onclick = addSegment;

    addContainer.appendChild(addButton);

    body.append(
        editor,
        addContainer
    );

    const footer = document.createElement("div");
    footer.className = "modal-footer";

    const cancel = document.createElement("button");
    cancel.className = "btn";
    cancel.textContent = "Abbrechen";

    const save = document.createElement("button");
    save.className = "btn primary";
    save.textContent = "Speichern";

    cancel.onclick = closeModal;

    save.onclick = () => {
        collectSegmentEditorNames();
        saveDatabase();
        closeModal();
        renderTimer();
    };

    footer.append(
        cancel,
        save
    );

    modal.append(
        header,
        body,
        footer
    );

    overlay.appendChild(modal);
    root.appendChild(overlay);

    closeButton.onclick = closeModal;

    overlay.addEventListener("click",event => {
        if(event.target === overlay){
            closeModal();
        }
    });

    if(focusId){
        setTimeout(() => {
            const input = document.getElementById(
                "segmentInput_" + focusId
            );

            if(input){
                input.focus();
                input.select();
            }
        },50);
    }
}

function addSegment(){
    collectSegmentEditorNames();

    const project = getProject();

    if(!project){
        return;
    }

    const newSegment = {
        id:createId(),
        name:"Neues Segment"
    };

    project.segments.push(newSegment);

    saveDatabase();

    openSegmentEditor(newSegment.id);
}

function removeSegment(index){
    const project = getProject();

    if(!project){
        return;
    }

    if(project.segments.length <= 1){
        return;
    }

    collectSegmentEditorNames();

    project.segments.splice(index,1);

    if(timerState.currentSegment >= project.segments.length){
        timerState.currentSegment =
            project.segments.length - 1;
    }

    timerState.segmentTimes.splice(index,1);

    saveDatabase();

    openSegmentEditor();
}

function moveSegment(index,direction){
    const project = getProject();

    if(!project){
        return;
    }

    const target = index + direction;

    if(target < 0 || target >= project.segments.length){
        return;
    }

    collectSegmentEditorNames();

    const segments = project.segments;

    const temp = segments[index];

    segments[index] = segments[target];
    segments[target] = temp;

    const times = timerState.segmentTimes;

    const tempTime = times[index];

    times[index] = times[target];
    times[target] = tempTime;

    if(timerState.currentSegment === index){
        timerState.currentSegment = target;
    }else if(timerState.currentSegment === target){
        timerState.currentSegment = index;
    }

    saveDatabase();

    openSegmentEditor();
}


/* =========================
   PROJEKT MODAL
========================= */

function openProjectModal(project = null){
    const isEdit = !!project;

    openModal(
        isEdit ? "Speedrun bearbeiten" : "Neuer Speedrun",
        `
            <div class="form-group">
                <label class="form-label">
                    Name
                </label>

                <input
                    id="projectNameInput"
                    class="form-input"
                    type="text"
                    maxlength="80"
                    autocomplete="off"
                    value="${escapeHtml(project ? project.name : "")}"
                    placeholder="z.B. Super Game Any%"
                >
            </div>
        `,
        `
            <button class="btn" id="projectCancelBtn">
                Abbrechen
            </button>

            <button class="btn primary" id="projectSaveBtn">
                ${isEdit ? "Speichern" : "Erstellen"}
            </button>
        `
    );

    const input = document.getElementById("projectNameInput");

    setTimeout(() => {
        input.focus();

        if(isEdit){
            input.select();
        }
    },50);

    document.getElementById("projectCancelBtn").onclick = closeModal;

    document.getElementById("projectSaveBtn").onclick = () => {

        const name = input.value.trim();

        if(!name){
            input.focus();
            return;
        }

        if(isEdit){
            project.name = name;
        }else{
            const newProject = {
                id:createId(),
                name:name,
                segments:[
                    {
                        id:createId(),
                        name:"Segment 1"
                    }
                ],
                history:[]
            };

            database.projects.push(newProject);
        }

        saveDatabase();
        closeModal();

        renderHome();
    };
}


/* =========================
   LÖSCHEN
========================= */

function deleteProject(id){
    const project = database.projects.find(
        p => p.id === id
    );

    if(!project){
        return;
    }

    const performDelete = () => {

        database.projects =
            database.projects.filter(
                p => p.id !== id
            );

        saveDatabase();

        renderHome();
    };

    if(database.settings.confirmDelete){
        openConfirm(
            "Speedrun löschen?",
            "Der Speedrun inklusive seiner gespeicherten Runs wird gelöscht.",
            performDelete
        );
    }else{
        performDelete();
    }
}


/* =========================
   MODAL SYSTEM
========================= */

function openModal(title,body,footer){
    const root = document.getElementById("modalRoot");

    root.replaceChildren();

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";

    const modal = document.createElement("div");
    modal.className = "modal";

    const header = document.createElement("div");
    header.className = "modal-header";

    const titleElement = document.createElement("div");
    titleElement.className = "modal-title";
    titleElement.textContent = title;

    const close = document.createElement("button");
    close.className = "icon-btn";
    close.textContent = "×";
    close.onclick = closeModal;

    header.append(
        titleElement,
        close
    );

    const bodyElement = document.createElement("div");
    bodyElement.className = "modal-body";
    bodyElement.innerHTML = body;

    const footerElement = document.createElement("div");
    footerElement.className = "modal-footer";
    footerElement.innerHTML = footer;

    modal.append(
        header,
        bodyElement,
        footerElement
    );

    overlay.appendChild(modal);
    root.appendChild(overlay);

    overlay.addEventListener("click",event => {
        if(event.target === overlay){
            closeModal();
        }
    });
}

function openConfirm(title,message,action){
    openModal(
        title,
        `
            <div style="color:var(--muted);line-height:1.5;">
                ${escapeHtml(message)}
            </div>
        `,
        `
            <button class="btn" id="confirmCancel">
                Abbrechen
            </button>

            <button class="btn red" id="confirmOk">
                Bestätigen
            </button>
        `
    );

    document.getElementById("confirmCancel").onclick =
        closeModal;

    document.getElementById("confirmOk").onclick = () => {
        closeModal();
        action();
    };
}

function closeModal(){
    document.getElementById("modalRoot").replaceChildren();
}

/* =========================
   TASTATUR
========================= */

document.addEventListener("keydown",event => {

    if(event.key === "Escape"){
        closeModal();
        return;
    }

    if(document.getElementById("modalRoot").children.length > 0){
        return;
    }

    if(!getProject()){
        return;
    }

    const tag = document.activeElement?.tagName;

    if(tag === "INPUT" || tag === "TEXTAREA"){
        return;
    }

    if(event.code === "Space"){
        event.preventDefault();

        if(timerState.running){
            splitTimer();
        }else{
            startTimer();
        }
    }

    if(event.key.toLowerCase() === "r"){
        resetTimer(false);
    }
});

   HEADER
========================= */

document.getElementById("homeBtn").onclick = () => {

    if(timerState.running && getProject()){
        openConfirm(
            "Zum Hauptmenü?",
            "Der aktuelle Lauf läuft gerade.",
            () => renderHome()
        );
    }else{
        renderHome();
    }
};

document.getElementById("settingsBtn").onclick =
    openSettings;


/* =========================
   START
========================= */

loadDatabase();

renderHome();

</script>
