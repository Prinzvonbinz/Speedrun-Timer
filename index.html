<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>Speedrun Timer</title>

<style>

:root{
    --bg:#0b0d10;
    --bg2:#101318;
    --panel:#151920;
    --panel2:#1a1f27;
    --panel3:#202630;
    --border:#292f38;
    --border2:#343b46;
    --text:#f1f3f5;
    --muted:#858d98;
    --muted2:#606873;
    --accent:#e9edf2;
    --accentText:#0b0d10;
    --green:#58d68d;
    --red:#ff6868;
    --yellow:#f3c969;
    --blue:#6ea8ff;
    --purple:#b78cff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

input,
select{
    outline:none;
}

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
}

.screen{
    min-height:100vh;
    padding:20px;
}

.page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
}


/* =========================================================
   HOME
========================================================= */

.home-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e9edf2;
    color:#0b0d10;
    font-size:23px;
    font-weight:900;
}

.brand-title{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
}

.brand-subtitle{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
}

.new-run-button{
    border:0;
    border-radius:11px;
    padding:12px 17px;
    background:var(--accent);
    color:var(--accentText);
    font-weight:800;
}

.home-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:24px;
}

.stat-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:14px;
}

.stat-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
}

.stat-value{
    font-size:22px;
    font-weight:800;
    margin-top:7px;
}

.projects-title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.section-heading{
    font-size:17px;
    font-weight:800;
}

.section-small{
    color:var(--muted);
    font-size:12px;
}

.project-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.project-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:17px;
    transition:.15s;
}

.project-card:hover{
    border-color:var(--border2);
}

.project-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
}

.project-name{
    font-size:19px;
    font-weight:800;
}

.project-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.project-pb{
    margin-top:18px;
    font-family:"Courier New",monospace;
    font-size:25px;
    font-weight:800;
}

.project-pb-label{
    font-family:Arial,sans-serif;
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:4px;
}

.project-actions{
    display:flex;
    gap:7px;
    margin-top:17px;
}

.btn{
    border:1px solid var(--border2);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
    padding:9px 12px;
}

.btn.primary{
    background:var(--accent);
    color:var(--accentText);
    border-color:var(--accent);
    font-weight:800;
}

.btn.danger{
    color:var(--red);
}

.btn.small{
    font-size:12px;
    padding:8px 10px;
}

.empty-state{
    border:1px dashed var(--border2);
    border-radius:15px;
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
}

.empty-title{
    color:var(--text);
    font-size:17px;
    font-weight:800;
    margin-bottom:6px;
}


/* =========================================================
   FORM
========================================================= */

.form-page{
    max-width:720px;
    margin:0 auto;
}

.form-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
}

.form-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:25px;
}

.back-button{
    border:1px solid var(--border2);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
    padding:9px 12px;
}

.form-title{
    font-size:23px;
    font-weight:900;
}

.form-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.field{
    margin-bottom:18px;
}

.field-label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:7px;
}

.text-input{
    width:100%;
    border:1px solid var(--border2);
    background:#0e1115;
    color:var(--text);
    border-radius:10px;
    padding:12px 13px;
}

.text-input:focus{
    border-color:#59616d;
}

.segments-editor{
    margin-top:25px;
}

.editor-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.editor-heading-title{
    font-size:14px;
    font-weight:800;
}

.segment-editor-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.segment-index{
    flex:0 0 30px;
    width:30px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted2);
    font-size:12px;
}

.segment-remove{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--red);
    font-size:19px;
}

.add-segment-button{
    width:100%;
    margin-top:5px;
    border:1px dashed var(--border2);
    background:#111419;
    color:var(--muted);
    padding:12px;
    border-radius:10px;
}

.form-footer{
    display:flex;
    gap:8px;
    margin-top:25px;
}

.form-footer .btn{
    flex:1;
}


/* =========================================================
   TIMER HEADER
========================================================= */

.timer-page{
    min-height:100vh;
    background:var(--bg);
}

.timer-topbar{
    position:sticky;
    top:0;
    z-index:50;
    min-height:65px;
    display:grid;
    grid-template-columns:100px 1fr 100px;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:rgba(11,13,16,.96);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
}

.timer-back{
    justify-self:start;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:9px;
    padding:8px 11px;
}

.timer-title-wrap{
    text-align:center;
    min-width:0;
}

.timer-project-name{
    font-weight:900;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.timer-project-subtitle{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.timer-menu{
    justify-self:end;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--muted);
    border-radius:9px;
    padding:8px 11px;
}


/* =========================================================
   TIMER MAIN
========================================================= */

.timer-main{
    width:100%;
    max-width:1050px;
    margin:0 auto;
    padding:25px 15px 170px;
}

.timer-display-card{
    text-align:center;
    padding:20px 10px 28px;
}

.timer-display{
    font-family:"Courier New",Courier,monospace;
    font-size:clamp(50px,13vw,105px);
    font-weight:700;
    line-height:1;
    letter-spacing:-5px;
    white-space:nowrap;
}

.timer-state{
    color:var(--muted);
    font-size:12px;
    margin-top:13px;
    min-height:16px;
}

.timer-state.running{
    color:var(--green);
}

.timer-state.paused{
    color:var(--yellow);
}

.timer-state.finished{
    color:var(--blue);
}

.timer-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:14px;
    align-items:start;
}


/* =========================================================
   SEGMENT PANEL
========================================================= */

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 15px;
    border-bottom:1px solid var(--border);
}

.panel-title{
    font-weight:800;
    font-size:14px;
}

.panel-subtitle{
    color:var(--muted);
    font-size:11px;
}

.segment-list{
    padding:5px;
}

.segment-row{
    display:grid;
    grid-template-columns:35px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    min-height:51px;
    padding:8px 10px;
    border-radius:9px;
    margin:2px 0;
}

.segment-row.current{
    background:var(--panel3);
}

.segment-row.completed{
    opacity:.92;
}

.segment-row.future{
    color:#737a84;
}

.segment-number{
    color:var(--muted2);
    font-family:"Courier New",monospace;
    font-size:11px;
    text-align:center;
}

.segment-row.current .segment-number{
    color:var(--text);
}

.segment-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.segment-time{
    font-family:"Courier New",monospace;
    font-size:14px;
    min-width:92px;
    text-align:right;
}

.segment-delta{
    display:none;
    font-size:10px;
    min-width:50px;
    text-align:right;
}

.segment-delta.good{
    color:var(--green);
}

.segment-delta.bad{
    color:var(--red);
}


/* =========================================================
   SIDE PANELS
========================================================= */

.side-stack{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.pb-card{
    padding:16px;
}

.pb-label{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.8px;
}

.pb-time{
    font-family:"Courier New",monospace;
    font-size:28px;
    font-weight:800;
    margin-top:5px;
}

.pb-extra{
    margin-top:8px;
    font-size:11px;
    color:var(--muted);
}

.side-history{
    max-height:380px;
    overflow:auto;
}

.history-item{
    padding:11px 13px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.history-item:last-child{
    border-bottom:0;
}

.history-run{
    font-size:12px;
    font-weight:700;
}

.history-date{
    color:var(--muted2);
    font-size:9px;
    margin-top:4px;
}

.history-time{
    font-family:"Courier New",monospace;
    font-size:13px;
    font-weight:700;
}

.history-empty{
    color:var(--muted);
    font-size:12px;
    padding:18px;
    text-align:center;
}


/* =========================================================
   BOTTOM CONTROLS
========================================================= */

.timer-controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    padding:10px;
    background:rgba(10,12,15,.97);
    border-top:1px solid var(--border);
    backdrop-filter:blur(15px);
}

.controls-inner{
    width:100%;
    max-width:1050px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:8px;
}

.timer-button{
    min-height:54px;
    border-radius:11px;
    border:1px solid var(--border2);
    background:var(--panel2);
    color:var(--text);
    font-weight:800;
}

.timer-button.primary{
    background:var(--accent);
    color:var(--accentText);
    border-color:var(--accent);
}

.timer-button.split{
    background:#252b34;
}

.timer-button.pause{
    background:#20252d;
}

.timer-button.resume{
    background:var(--accent);
    color:var(--accentText);
    border-color:var(--accent);
}

.timer-button:disabled{
    opacity:.35;
    cursor:default;
}


/* =========================================================
   TIMER MENU
========================================================= */

.menu-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

.menu-box{
    width:min(330px,90vw);
    margin:70px 15px 0;
    background:var(--panel);
    border:1px solid var(--border2);
    border-radius:14px;
    padding:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    border-radius:9px;
    padding:13px;
}

.menu-item:hover{
    background:var(--panel2);
}

.menu-item.danger{
    color:var(--red);
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.7);
}

.modal{
    width:min(430px,100%);
    background:var(--panel);
    border:1px solid var(--border2);
    border-radius:16px;
    padding:20px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.modal-title{
    font-size:19px;
    font-weight:900;
}

.modal-text{
    margin-top:9px;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
}


/* =========================================================
   TOAST
========================================================= */

.toast-container{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    z-index:600;
    display:flex;
    flex-direction:column;
    gap:7px;
    pointer-events:none;
}

.toast{
    background:#222730;
    border:1px solid var(--border2);
    color:var(--text);
    padding:10px 14px;
    border-radius:9px;
    font-size:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .home-stats{
        grid-template-columns:repeat(2,1fr);
    }

    .project-grid{
        grid-template-columns:1fr;
    }

    .timer-layout{
        grid-template-columns:1fr;
    }

    .side-stack{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .screen{
        padding:14px;
    }

    .home-header{
        align-items:flex-start;
    }

    .brand-title{
        font-size:22px;
    }

    .brand-icon{
        width:40px;
        height:40px;
        font-size:19px;
    }

    .new-run-button{
        padding:10px 11px;
        font-size:12px;
    }

    .home-stats{
        gap:7px;
    }

    .stat-card{
        padding:11px;
    }

    .stat-value{
        font-size:18px;
    }

    .timer-topbar{
        grid-template-columns:72px 1fr 72px;
        padding:9px;
    }

    .timer-back,
    .timer-menu{
        padding:8px;
        font-size:11px;
    }

    .timer-main{
        padding-top:15px;
        padding-bottom:145px;
    }

    .timer-display{
        font-size:clamp(42px,14vw,75px);
        letter-spacing:-3px;
    }

    .timer-layout{
        gap:10px;
    }

    .side-stack{
        grid-template-columns:1fr;
    }

    .controls-inner{
        grid-template-columns:1fr 1fr;
    }

    .timer-button{
        min-height:50px;
    }

}

</style>
</head>

<body>

<div id="app"></div>
<div id="toastContainer" class="toast-container"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "speedrun_timer_complete_v4";


let data = {
    projects: [],
    settings: {
        confirmReset:true,
        confirmDelete:true
    }
};


let activeProjectId = null;


let timer = {
    running:false,
    finished:false,
    currentSegment:0,
    segmentTimes:[],
    segmentStartedAt:0,
    runStartedAt:null
};


/* =========================================================
   UTILITIES
========================================================= */

function createId(){
    return Math.random().toString(36).substring(2,11);
}


function saveData(){
    try{
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );
    }catch(error){
        console.log("Speichern fehlgeschlagen");
    }
}


function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(
                parsed &&
                Array.isArray(parsed.projects)
            ){
                data = parsed;
            }
        }

    }catch(error){

        console.log("Laden fehlgeschlagen");

    }

    normalizeData();
}


function normalizeData(){

    if(!Array.isArray(data.projects)){
        data.projects = [];
    }

    if(!data.settings){
        data.settings = {};
    }

    if(
        typeof data.settings.confirmReset !==
        "boolean"
    ){
        data.settings.confirmReset = true;
    }

    if(
        typeof data.settings.confirmDelete !==
        "boolean"
    ){
        data.settings.confirmDelete = true;
    }


    data.projects.forEach(project => {

        if(!project.id){
            project.id = createId();
        }

        if(!project.name){
            project.name = "Speedrun";
        }

        if(!Array.isArray(project.segments)){
            project.segments = [];
        }

        if(!Array.isArray(project.history)){
            project.history = [];
        }


        project.segments =
            project.segments.map(segment => {

                if(typeof segment === "string"){

                    return {
                        id:createId(),
                        name:segment
                    };

                }

                return {
                    id:segment.id || createId(),
                    name:segment.name || "Segment"
                };

            });


        project.history =
            project.history.filter(run => {

                return run &&
                    typeof run.total === "number";

            });

    });


    saveData();
}


function getProject(){

    return data.projects.find(
        project => project.id === activeProjectId
    );
}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function formatTime(ms){

    if(!Number.isFinite(ms)){
        ms = 0;
    }

    ms = Math.max(0,ms);

    const minutes =
        Math.floor(ms / 60000);

    const seconds =
        Math.floor((ms % 60000) / 1000);

    const milliseconds =
        Math.floor(ms % 1000);


    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        String(milliseconds).padStart(3,"0")
    );
}


function formatShortTime(ms){

    if(!Number.isFinite(ms)){
        return "--:--.---";
    }

    return formatTime(ms);
}


function formatDate(timestamp){

    if(!timestamp){
        return "";
    }

    return new Date(timestamp).toLocaleString(
        "de-DE",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function totalOfSegments(times){

    return times.reduce(
        (sum,value) => sum + (value || 0),
        0
    );
}


function getProjectPB(project){

    if(
        !project ||
        !Array.isArray(project.history) ||
        project.history.length === 0
    ){
        return null;
    }

    const completed =
        project.history.filter(run => run.completed);

    if(completed.length === 0){
        return null;
    }

    return Math.min(
        ...completed.map(run => run.total)
    );
}


function getBestSegment(project,index){

    if(
        !project ||
        !project.history ||
        project.history.length === 0
    ){
        return null;
    }

    const values =
        project.history
            .filter(run => run.completed)
            .map(run => {

                if(
                    !Array.isArray(run.segments) ||
                    typeof run.segments[index] !== "number"
                ){
                    return null;
                }

                return run.segments[index];

            })
            .filter(value => value !== null);

    if(values.length === 0){
        return null;
    }

    return Math.min(...values);
}


function getBestPossible(project){

    if(!project){
        return null;
    }

    let total = 0;

    for(
        let i = 0;
        i < project.segments.length;
        i++
    ){

        const best =
            getBestSegment(project,i);

        if(best === null){
            return null;
        }

        total += best;
    }

    return total;
}

        segments.push({

            name:"Segment 1"
        });

    const editor =
        document.getElementById(
            "segmentEditorList"
        );


    function renderSegments(){

        editor.innerHTML = "";


        segments.forEach((segment,index) => {

            const row =
                document.createElement("div");

            row.className =
                "segment-editor-row";


            const number =
                document.createElement("div");

            number.className =
                "segment-index";

            number.textContent =
                index + 1;


            const input =
                document.createElement("input");

            input.className =
                "text-input";

            input.type = "text";
            input.autocomplete = "off";
            input.value = segment.name;


            input.oninput = () => {
                segment.name = input.value;
            };


            const remove =
                document.createElement("button");

            remove.className =
                "segment-remove";

            remove.textContent = "×";


            remove.onclick = () => {

                if(segments.length <= 1){

                    showToast(
                        "Mindestens ein Segment benötigt."
                    );

                    return;
                }


                segments.splice(index,1);

                renderSegments();

            };


            row.appendChild(number);
            row.appendChild(input);
            row.appendChild(remove);

            editor.appendChild(row);

        });


        document
            .getElementById("segmentCountLabel")
            .textContent =
                segments.length +
                (
                    segments.length === 1
                    ? " Segment"
                    : " Segmente"
                );

    }


    renderSegments();


    document
        .getElementById("addSegment")
        .onclick = () => {

            segments.push({
                id:createId(),
                name:
                    "Segment " +
                    (segments.length + 1)
            });

            renderSegments();

            const inputs =
                editor.querySelectorAll("input");

            if(inputs.length){
                inputs[inputs.length - 1].focus();
            }

        };


    document
        .getElementById("editorBack")
        .onclick = showHome;


    document
        .getElementById("cancelEditor")
        .onclick = showHome;


    document
        .getElementById("saveEditor")
        .onclick = () => {

            const nameInput =
                document.getElementById(
                    "projectName"
                );


            const name =
                nameInput.value.trim();


            if(!name){

                showToast(
                    "Bitte gib einen Namen ein."
                );

                nameInput.focus();

                return;
            }


            const cleanSegments =
                segments
                    .map(segment => ({
                        id:segment.id || createId(),
                        name:segment.name.trim()
                    }))
                    .filter(
                        segment =>
                            segment.name.length > 0
                    );


            if(cleanSegments.length === 0){

                showToast(
                    "Du brauchst mindestens ein Segment."
                );

                return;
            }


            if(isEdit){

                project.name = name;
                project.segments =
                    cleanSegments;

            }else{

                data.projects.push({
                    id:createId(),
                    name:name,
                    segments:cleanSegments,
                    history:[]
                });

            }


            saveData();

            showToast(
                isEdit
                ? "Speedrun gespeichert."
                : "Speedrun erstellt."
            );

            setTimeout(showHome,300);

        };

}

/* =========================================================
   TIMER CURRENT TIME
========================================================= */

function getCurrentSegmentElapsed(){

    if(!timer.running){

        return (
            timer.segmentTimes[
                timer.currentSegment
            ] || 0
        );

    }


    return (
        performance.now() -
        timer.segmentStartedAt
    );

}


/* =========================================================
   TIMER TOTAL
========================================================= */

function getCurrentTotal(){

    let total = 0;


    timer.segmentTimes.forEach(
        (value,index) => {

            if(
                timer.running &&
                index === timer.currentSegment
            ){

                total +=
                    getCurrentSegmentElapsed();

            }else{

                total += value || 0;

            }

        }
    );


    return total;

}


/* =========================================================
   START
========================================================= */

function startTimer(){

    if(timer.finished){
        return;
    }


    if(timer.running){
        return;
    }


    const hasExistingTime =
        timer.segmentTimes.some(
            value => value > 0
        );


    if(hasExistingTime){

        continueTimer();

        return;
    }


    timer.running = true;

    timer.segmentStartedAt =
        performance.now();

    timer.runStartedAt =
        Date.now();


    updateTimerButton();

    updateTimerDisplay();


    requestAnimationFrame(timerLoop);

}


/* =========================================================
   CONTINUE
========================================================= */

function continueTimer(){

    if(timer.running){
        return;
    }


    if(timer.finished){
        return;
    }


    const project = getProject();


    if(!project){
        return;
    }


    const alreadyElapsed =
        timer.segmentTimes[
            timer.currentSegment
        ] || 0;


    timer.running = true;


    /*
       Ganz wichtig:

       Die bereits gelaufene Zeit wird
       vom neuen Startzeitpunkt abgezogen.

       Dadurch läuft der Timer exakt dort weiter,
       wo Stop gedrückt wurde.
    */

    timer.segmentStartedAt =
        performance.now() -
        alreadyElapsed;


    if(!timer.runStartedAt){

        timer.runStartedAt =
            Date.now();

    }


    updateTimerButton();

    updateTimerDisplay();


    requestAnimationFrame(timerLoop);

}


/* =========================================================
   TIMER LOOP
========================================================= */

function timerLoop(){

    if(!timer.running){
        return;
    }


    updateTimerDisplay();

    renderCurrentSegmentTime();


    requestAnimationFrame(timerLoop);

}


/* =========================================================
   SPLIT
========================================================= */

function splitTimer(){

    if(!timer.running){

        /*
           Wie vorher:
           Split startet den Timer,
           wenn er noch nicht läuft.
        */

        startTimer();

        return;
    }


    const project = getProject();


    if(!project){
        return;
    }


    const elapsed =
        getCurrentSegmentElapsed();


    timer.segmentTimes[
        timer.currentSegment
    ] = elapsed;


    /*
       Letztes Segment:
       Run fertig.
    */

    if(
        timer.currentSegment >=
        project.segments.length - 1
    ){

        timer.running = false;
        timer.finished = true;


        saveCompletedRun();


        updateTimerButton();
        updateTimerDisplay();
        renderSegmentList();
        renderHistory();


        showToast(
            "Run abgeschlossen!"
        );


        return;
    }


    /*
       Zum nächsten Segment.
    */

    timer.currentSegment++;


    timer.segmentStartedAt =
        performance.now();


    updateTimerButton();
    updateTimerDisplay();
    renderSegmentList();

}


/* =========================================================
   STOP
========================================================= */

function stopTimer(){

    if(!timer.running){
        return;
    }


    const elapsed =
        getCurrentSegmentElapsed();


    /*
       Aktuelle Zeit festhalten.
    */

    timer.segmentTimes[
        timer.currentSegment
    ] = elapsed;


    timer.running = false;


    /*
       KEIN Speichern in der History.

       Stop ist jetzt nur Pause.
    */


    updateTimerButton();
    updateTimerDisplay();
    renderSegmentList();


    showToast("Timer pausiert.");

}


/* =========================================================
   STOP / CONTINUE BUTTON
========================================================= */

function updateTimerButton(){

    const button =
        document.getElementById(
            "stopContinueButton"
        );


    if(!button){
        return;
    }


    if(timer.finished){

        button.textContent = "Stop";

        button.disabled = true;

        button.classList.remove("resume");

        button.classList.add("pause");

        button.onclick = null;

        return;
    }


    if(timer.running){

        button.textContent = "Stop";

        button.disabled = false;

        button.classList.remove("resume");

        button.classList.add("pause");

        button.onclick = stopTimer;

    }else{

        button.textContent = "Weiter";

        button.disabled = false;

        button.classList.remove("pause");

        button.classList.add("resume");

        button.onclick = continueTimer;

    }

}


/* =========================================================
   DISPLAY UPDATE
========================================================= */

function updateTimerDisplay(){

    const display =
        document.getElementById(
            "timerDisplay"
        );


    const state =
        document.getElementById(
            "timerState"
        );


    if(!display){
        return;
    }


    display.textContent =
        formatTime(
            getCurrentTotal()
        );


    if(!state){
        return;
    }


    state.classList.remove(
        "running",
        "paused",
        "finished"
    );


    if(timer.finished){

        state.textContent =
            "Run abgeschlossen";

        state.classList.add("finished");

    }else if(timer.running){

        state.textContent =
            "Segment " +
            (timer.currentSegment + 1) +
            " läuft";

        state.classList.add("running");

    }else if(
        getCurrentTotal() > 0
    ){

        state.textContent =
            "Pausiert";

        state.classList.add("paused");

    }else{

        state.textContent =
            "Bereit";

    }


    const progress =
        document.getElementById(
            "segmentProgress"
        );


    const project = getProject();


    if(progress && project){

        progress.textContent =
            (
                timer.finished
                ?
                project.segments.length
                :
                Math.min(
                    timer.currentSegment + 1,
                    project.segments.length
                )
            )
            +
            " / " +
            project.segments.length;

    }

}


/* =========================================================
   LIVE CURRENT SEGMENT
========================================================= */

function renderCurrentSegmentTime(){

    const project = getProject();

    if(!project){
        return;
    }


    const rows =
        document.querySelectorAll(
            ".segment-row"
        );


    rows.forEach((row,index) => {

        const timeElement =
            row.querySelector(
                ".segment-time"
            );


        if(!timeElement){
            return;
        }


        let time =
            timer.segmentTimes[index] || 0;


        if(
            timer.running &&
            index === timer.currentSegment
        ){

            time =
                getCurrentSegmentElapsed();

        }


        timeElement.textContent =
            formatTime(time);

    });

}


/* =========================================================
   SEGMENT LIST
========================================================= */

function renderSegmentList(){

    const project = getProject();

    const container =
        document.getElementById(
            "segmentList"
        );


    if(!project || !container){
        return;
    }


    container.innerHTML = "";


    project.segments.forEach(
        (segment,index) => {

            const row =
                document.createElement("div");


            row.className =
                "segment-row";


            if(
                index ===
                timer.currentSegment &&
                !timer.finished
            ){

                row.classList.add(
                    "current"
                );

            }


            if(
                index <
                timer.currentSegment
            ){

                row.classList.add(
                    "completed"
                );

            }


            if(
                index >
                timer.currentSegment
            ){

                row.classList.add(
                    "future"
                );

            }


            const number =
                document.createElement("div");

            number.className =
                "segment-number";

            number.textContent =
                String(index + 1).padStart(
                    2,
                    "0"
                );


            const name =
                document.createElement("div");

            name.className =
                "segment-name";

            name.textContent =
                segment.name;


            const time =
                document.createElement("div");

            time.className =
                "segment-time";


            let value =
                timer.segmentTimes[index] || 0;


            if(
                timer.running &&
                index === timer.currentSegment
            ){

                value =
                    getCurrentSegmentElapsed();

            }


            time.textContent =
                formatTime(value);


            row.appendChild(number);
            row.appendChild(name);
            row.appendChild(time);


            container.appendChild(row);

        }
    );

}


/* =========================================================
   SAVE COMPLETED RUN
========================================================= */

function saveCompletedRun(){

    const project = getProject();


    if(!project){
        return;
    }


    const total =
        totalOfSegments(
            timer.segmentTimes
        );


    project.history.unshift({

        id:createId(),

        timestamp:Date.now(),

        total:total,

        segments:[
            ...timer.segmentTimes
        ],

        completed:true

    });


    /*
       History begrenzen.
    */

    if(project.history.length > 100){

        project.history =
            project.history.slice(
                0,
                100
            );

    }


    saveData();

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

    const project = getProject();

    const container =
        document.getElementById(
            "historyList"
        );


    if(!project || !container){
        return;
    }


    container.innerHTML = "";


    if(
        !project.history ||
        project.history.length === 0
    ){

        container.innerHTML = `
            <div class="history-empty">
                Noch keine Runs.
            </div>
        `;

        updatePBDisplay();

        return;
    }


    project.history
        .slice(0,20)
        .forEach((run,index) => {

            const item =
                document.createElement("div");


            item.className =
                "history-item";


            const left =
                document.createElement("div");


            const runName =
                document.createElement("div");


            runName.className =
                "history-run";


            runName.textContent =
                "Run " +
                (
                    project.history.length -
                    index
                );


            const date =
                document.createElement("div");


            date.className =
                "history-date";


            date.textContent =
                formatDate(
                    run.timestamp
                );


            left.appendChild(runName);
            left.appendChild(date);


            const right =
                document.createElement("div");


            right.className =
                "history-time";


            right.textContent =
                formatTime(
                    run.total
                );


            item.appendChild(left);
            item.appendChild(right);


            container.appendChild(item);

        });


    updatePBDisplay();

}


/* =========================================================
   PB DISPLAY
========================================================= */

function updatePBDisplay(){

    const project = getProject();


    if(!project){
        return;
    }


    const pbElement =
        document.getElementById(
            "pbTime"
        );


    const possibleElement =
        document.getElementById(
            "possibleTime"
        );


    const pb =
        getProjectPB(project);


    const possible =
        getBestPossible(project);


    if(pbElement){

        pbElement.textContent =
            pb === null
            ? "--:--.---"
            : formatTime(pb);

    }


    if(possibleElement){

        possibleElement.textContent =
            possible === null
            ?
            "Bestmögliche Zeit noch nicht berechenbar"
            :
            "Bestmögliche Zeit: " +
            formatTime(possible);

    }

}


/* =========================================================
   RESET
========================================================= */

function resetTimer(){

    const reset =
        () => {

            const project =
                getProject();


            if(!project){
                return;
            }


            timer.running = false;

            timer.finished = false;

            timer.currentSegment = 0;

            timer.segmentTimes =
                project.segments.map(
                    () => 0
                );

            timer.segmentStartedAt = 0;

            timer.runStartedAt = null;


            updateTimerButton();

            updateTimerDisplay();

            renderSegmentList();


            showToast(
                "Segmentzeiten zurückgesetzt."
            );

        };


    if(
        data.settings.confirmReset &&
        getCurrentTotal() > 0
    ){

        showConfirm(
            "Timer zurücksetzen?",
            "Nur die aktuellen Zeiten werden auf Null gesetzt. Deine Segmente und gespeicherten Runs bleiben erhalten.",
            reset
        );

    }else{

        reset();

    }

}


/* =========================================================
   LEAVE TIMER
========================================================= */

function leaveTimer(){

    if(timer.running){

        showConfirm(
            "Timer verlassen?",
            "Der aktuelle, noch nicht abgeschlossene Lauf geht verloren.",
            () => showHome()
        );

        return;
    }


    showHome();

}


/* =========================================================
   TIMER MENU
========================================================= */

function openTimerMenu(){

    const existing =
        document.querySelector(
            ".menu-overlay"
        );


    if(existing){
        existing.remove();
        return;
    }


    const overlay =
        document.createElement("div");


    overlay.className =
        "menu-overlay";


    overlay.innerHTML = `
        <div class="menu-box">

            <button
                class="menu-item"
                id="menuEdit"
            >
                Segmente bearbeiten
            </button>

            <button
                class="menu-item"
                id="menuClearHistory"
            >
                Run-History löschen
            </button>

            <button
                class="menu-item danger"
                id="menuDelete"
            >
                Speedrun löschen
            </button>

        </div>
    `;


    document.body.appendChild(overlay);


    overlay.onclick = event => {

        if(event.target === overlay){
            overlay.remove();
        }

    };


    document
        .getElementById("menuEdit")
        .onclick = () => {

            overlay.remove();

            openProjectEditor(
                activeProjectId
            );

        };


    document
        .getElementById("menuClearHistory")
        .onclick = () => {

            overlay.remove();

            clearHistory();

        };


    document
        .getElementById("menuDelete")
        .onclick = () => {

            overlay.remove();

            deleteProject(
                activeProjectId
            );

        };

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory(){

    const project = getProject();


    if(!project){
        return;
    }


    showConfirm(
        "History löschen?",
        "Alle gespeicherten Runs dieses Speedruns werden gelöscht.",
        () => {

            project.history = [];

            saveData();

            renderHistory();

            showToast(
                "History gelöscht."
            );

        }
    );

}


/* =========================================================
   CONFIRM MODAL
========================================================= */

function showConfirm(
    title,
    message,
    callback
){

    const old =
        document.querySelector(
            ".modal-overlay"
        );


    if(old){
        old.remove();
    }


    const overlay =
        document.createElement("div");


    overlay.className =
        "modal-overlay";


    overlay.innerHTML = `
        <div class="modal">

            <div class="modal-title">
                ${escapeHtml(title)}
            </div>

            <div class="modal-text">
                ${escapeHtml(message)}
            </div>

            <div class="modal-buttons">

                <button
                    class="btn"
                    id="modalCancel"
                >
                    Abbrechen
                </button>

                <button
                    class="btn primary"
                    id="modalConfirm"
                >
                    Bestätigen
                </button>

            </div>

        </div>
    `;


    document.body.appendChild(overlay);


    document
        .getElementById("modalCancel")
        .onclick = () => {

            overlay.remove();

        };


    document
        .getElementById("modalConfirm")
        .onclick = () => {

            overlay.remove();

            callback();

        };

}


/* =========================================================
   INITIALIZE
========================================================= */

loadData();

showHome();


</script>
